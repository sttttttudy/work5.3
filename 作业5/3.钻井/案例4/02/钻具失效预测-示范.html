<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>钻具失效预测 · 示范</title>
<style>
  :root{
    --jade:#2f7d6b; --jade-d:#235f51; --jade-l:#e6f1ec;
    --clay:#b26a39; --clay-l:#f8ecdf;
    --ink:#242b2e; --ink-2:#4d565b; --ink-3:#79828a; --ink-4:#9ba3a9;
    --line:#e9e4d8; --line-2:#ddd7c8; --line-3:#c9c2b0;
    --card:#ffffff; --soft:#fdfcf9; --paper:#fbfaf6;
    --ok:#3f8560; --warn:#a97a1c; --bad:#b05a51;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; padding:16px 18px 22px; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:13px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .kick{ font-family:var(--mono); font-size:9px; letter-spacing:.15em;
    text-transform:uppercase; color:var(--jade-d); }
  h1{ font-size:17px; font-weight:650; margin:7px 0 0; letter-spacing:-.01em; }
  .desc{ margin:7px 0 0; font-size:12px; color:var(--ink-3);
    line-height:1.7; max-width:80ch; }
  .desc b{ color:var(--ink-2); }

  .grid{ display:grid; grid-template-columns:minmax(0,1fr) 232px;
    gap:12px; margin-top:14px; align-items:start; }

  .stage{ background:var(--card); border:1px solid var(--line);
    border-radius:9px; padding:9px 10px 8px; min-width:0; }
  .charts{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .charts svg{ display:block; width:100%; height:auto; }

  .legend{ display:flex; flex-wrap:wrap; gap:11px; margin-top:8px;
    font-size:9.8px; color:var(--ink-4); }
  .legend span{ display:flex; align-items:center; gap:5px; }
  .legend i{ width:11px; height:9px; border-radius:2px; display:block; }

  .side{ display:flex; flex-direction:column; gap:8px; min-width:0; }
  .metrics{ display:grid; grid-template-columns:1fr 1fr; gap:1px;
    background:var(--line); border:1px solid var(--line);
    border-radius:8px; overflow:hidden; }
  .metric{ background:var(--card); padding:8px 9px; }
  .metric .l{ font-family:var(--mono); font-size:7.4px; letter-spacing:.07em;
    color:var(--ink-4); white-space:nowrap; }
  .metric .v{ font-family:var(--mono); font-size:15px; margin-top:4px;
    line-height:1; color:var(--ink); }
  .metric .v small{ font-size:8px; color:var(--ink-4); margin-left:2px; }
  .metric.good .v{ color:var(--ok); }
  .metric.warn .v{ color:var(--warn); }
  .metric.bad .v{ color:var(--bad); }

  .verdict{ font-size:11.2px; line-height:1.7; color:var(--ink-2);
    border-left:2.5px solid var(--line-2); padding-left:9px; }
  .verdict b{ color:var(--ink); }
  .verdict.ok{ border-color:var(--ok); }
  .verdict.warn{ border-color:var(--warn); }
  .verdict.bad{ border-color:var(--bad); }

  .card{ border:1px solid var(--line); border-radius:8px;
    background:var(--soft); padding:9px 10px; }
  .card h5{ margin:0 0 6px; font-family:var(--mono); font-size:7.6px;
    letter-spacing:.1em; color:var(--ink-4); font-weight:400; text-transform:uppercase; }
  table{ width:100%; border-collapse:collapse; font-size:9.6px; }
  th{ font-family:var(--mono); font-size:7.2px; letter-spacing:.06em;
    color:var(--ink-4); font-weight:400; text-align:right; padding:3px 0 4px;
    border-bottom:1px solid var(--line-2); }
  td{ padding:3px 0; border-bottom:1px solid var(--line); color:var(--ink-3);
    text-align:right; font-family:var(--mono); }
  th:first-child,td:first-child{ text-align:left; font-family:inherit; }
  tr:last-child td{ border-bottom:0; }
  td.hot{ color:var(--bad); font-weight:600; }
  td.cool{ color:var(--ok); }

  .ctrls{ display:flex; flex-wrap:wrap; align-items:center; gap:16px;
    margin-top:11px; padding:11px 14px; background:var(--card);
    border:1px solid var(--line); border-radius:9px; }
  .ctl{ display:flex; align-items:center; gap:9px; font-size:11.5px; color:var(--ink-2); }
  .ctl label{ font-family:var(--mono); font-size:9px; letter-spacing:.06em;
    color:var(--ink-3); white-space:nowrap; }
  .ctl input[type=range]{ -webkit-appearance:none; appearance:none;
    width:110px; height:4px; border-radius:2px; background:var(--line-2);
    outline:none; cursor:pointer; }
  .ctl input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none;
    width:15px; height:15px; border-radius:50%; background:var(--jade);
    border:2.5px solid var(--card); box-shadow:0 0 0 1px var(--jade); cursor:grab; }
  .ctl input[type=range]::-moz-range-thumb{ width:13px; height:13px;
    border-radius:50%; background:var(--jade); border:2.5px solid var(--card); cursor:grab; }
  .ctl .val{ font-family:var(--mono); font-size:10.5px; color:var(--jade-d);
    min-width:52px; text-align:right; }

  @media (max-width:760px){
    body{ padding:13px 13px 18px; }
    .grid{ grid-template-columns:1fr; }
    .charts{ grid-template-columns:1fr; }
    .ctrls{ gap:11px; }
    .ctl{ width:100%; justify-content:space-between; }
    .ctl input[type=range]{ flex:1; width:auto; }
  }
</style>
</head>
<body>

<div class="kick">INTERACTIVE · 雨流计数 + Miner</div>
<h1>次数最多的，往往不是最伤寿命的</h1>
<p class="desc">
  左图是某 100 m 进尺的循环谱（幅值—次数），右图是同一批循环各自贡献的损伤。
  把「幅值倍率」拉大，看损伤怎么从均匀分布翻转到单向集中；
  再拖「狗腿度」——<b>同一套载荷谱，在狗腿严重的井段寿命会被腰斩</b>。
</p>

<div class="grid">
  <div class="stage">
    <div class="charts">
      <svg id="c-n" viewBox="0 0 300 168" xmlns="http://www.w3.org/2000/svg" role="img"
           aria-label="循环谱"></svg>
      <svg id="c-d" viewBox="0 0 300 168" xmlns="http://www.w3.org/2000/svg" role="img"
           aria-label="损伤贡献"></svg>
    </div>
    <div class="legend">
      <span><i style="background:#41699b"></i>循环次数</span>
      <span><i style="background:#2f7d6b"></i>损伤贡献（低）</span>
      <span><i style="background:#b05a51"></i>损伤贡献（高）</span>
    </div>
  </div>

  <div class="side">
    <div class="metrics" id="metrics"></div>
    <div class="verdict" id="verdict"></div>
    <div class="card">
      <h5>五档幅值</h5>
      <table id="tbl"></table>
    </div>
    <div class="card">
      <h5>寿命换算</h5>
      <p style="margin:0;font-size:9.6px;line-height:1.65;color:var(--ink-4)">
        N 按 S—N 曲线取（N ∝ S<sup>-3</sup>），再按狗腿度缩放。
        <b style="color:var(--ink-2)">D = 1.0</b> 是理论失效点，
        工程上通常 <b style="color:var(--ink-2)">D = 0.8</b> 就开始排起钻窗口。
      </p>
    </div>
  </div>
</div>

<div class="ctrls">
  <div class="ctl">
    <label>幅值倍率</label>
    <input type="range" id="s-amp" min="60" max="160" step="5" value="100">
    <span class="val" id="v-amp">1.00</span>
  </div>
  <div class="ctl">
    <label>循环密度</label>
    <input type="range" id="s-cyc" min="60" max="220" step="10" value="120">
    <span class="val" id="v-cyc">120/100m</span>
  </div>
  <div class="ctl">
    <label>狗腿度</label>
    <input type="range" id="s-dls" min="1" max="5" step="0.5" value="3">
    <span class="val" id="v-dls">3.0°/30m</span>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     一、模型
     ---------------------------------------------------------
     BASE 幅值（kN）· SHAPE 基准次数分布
     S—N：N = C / S^3，C = 5e8（S=5 时 N=4e6）
     狗腿度：等效于应力集中，N_eff = N / (dls/3)^1.6
     ========================================================= */
  var BASE = [5, 10, 15, 20, 30];
  var SHAPE = [0.46, 0.28, 0.15, 0.08, 0.03];
  var C_SN = 5e8;
  var D_LIMIT = 0.80;          /* 起钻预算 */
  var COEF = 12;               /* 量级缩放，让 D 落在可读区间 */

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  /* 载荷谱随幅值倍率平移：载荷整体变大时，高幅值循环占比上升 */
  function shapedWeights(amp) {
    var w = [], i, sum = 0;
    for (i = 0; i < 5; i++) {
      w.push(SHAPE[i] * Math.pow(amp, i * 0.35));
      sum += w[i];
    }
    for (i = 0; i < 5; i++) w[i] /= sum;
    return w;
  }

  function compute(st) {
    var amp = st.amp / 100;
    var dlsF = Math.pow(st.dls / 3, 1.6);
    var w = shapedWeights(amp);

    var rows = [], total = 0, i;
    for (i = 0; i < 5; i++) {
      var S = BASE[i] * amp;
      var n = w[i] * st.cyc * 10;
      var N = C_SN / Math.pow(S, 3) / dlsF;
      var d = n / Math.max(1, N) * COEF;
      rows.push({ S: S, n: n, N: N, d: d, w: w[i] });
      total += d;
    }

    var maxD = 0, hot = 0, maxN = 0, busiest = 0;
    for (i = 0; i < 5; i++) {
      if (rows[i].d > maxD) { maxD = rows[i].d; hot = i; }
      if (rows[i].n > maxN) { maxN = rows[i].n; busiest = i; }
    }

    var remain = total > 0 ? D_LIMIT / total * 100 : 99999;

    return {
      rows: rows, total: total, hot: hot, busiest: busiest,
      maxD: maxD, remain: remain,
      pct: rows.map(function (r) { return r.d / total * 100; })
    };
  }

  /* =========================================================
     二、绘图
     ========================================================= */
  var SW = 300, SH = 168;
  var X0 = 44, XR = 12, YT = 20, YB = 26;
  var BASE_Y = SH - YB;
  var PLOT_H = BASE_Y - YT;
  var BW = (SW - X0 - XR) / 5;

  function svgOpen() {
    return '<rect width="' + SW + '" height="' + SH + '" fill="#ffffff"/>';
  }

  function yAxisHint(s, label) {
    s += '<text x="0" y="12" font-size="7.2" fill="#9ba3a9" ' +
      'font-family="ui-monospace,monospace" letter-spacing=".05em">' + label + '</text>';
    return s;
  }

  function drawN(res) {
    var s = svgOpen(), i;
    s = yAxisHint(s, '循环次数 / 100 m');

    var max = 0;
    for (i = 0; i < 5; i++) max = Math.max(max, res.rows[i].n);
    if (max <= 0) max = 1;

    s += '<line x1="' + X0 + '" y1="' + BASE_Y + '" x2="' + (SW - XR) +
      '" y2="' + BASE_Y + '" stroke="#ddd7c8"/>';

    for (i = 0; i < 5; i++) {
      var n = res.rows[i].n;
      var h = Math.max(1, n / max * PLOT_H);
      var x = X0 + i * BW + 4;
      var w = BW - 10;
      var isBusy = (i === res.busiest);
      var op = 0.35 + 0.5 * (n / max);

      s += '<rect x="' + x.toFixed(1) + '" y="' + (BASE_Y - h).toFixed(1) +
        '" width="' + w.toFixed(1) + '" height="' + h.toFixed(1) +
        '" rx="2" fill="#41699b" fill-opacity="' + op.toFixed(2) + '"/>';

      if (isBusy) {
        s += '<rect x="' + (x - 1).toFixed(1) + '" y="' + (BASE_Y - h - 1).toFixed(1) +
          '" width="' + (w + 2).toFixed(1) + '" height="' + (h + 2).toFixed(1) +
          '" rx="3" fill="none" stroke="#41699b" stroke-width="1.2" ' +
          'stroke-dasharray="3 2"/>';
      }

      var label = n >= 1000 ? (n / 1000).toFixed(1) + 'k' : Math.round(n);
      s += '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (BASE_Y - h - 5).toFixed(1) +
        '" font-size="7.6" fill="' + (isBusy ? '#41699b' : '#9ba3a9') +
        '" text-anchor="middle" font-family="ui-monospace,monospace"' +
        (isBusy ? ' font-weight="600"' : '') + '>' + label + '</text>';

      s += '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (BASE_Y + 13) +
        '" font-size="7.4" fill="#9ba3a9" text-anchor="middle" ' +
        'font-family="ui-monospace,monospace">±' + Math.round(res.rows[i].S) + '</text>';
    }

    s += '<text x="' + (SW - XR) + '" y="' + (SH - 4) + '" font-size="7.2" ' +
      'fill="#9ba3a9" text-anchor="end">幅值 kN</text>';

    if (res.busiest === 0) {
      s += '<text x="' + X0 + '" y="' + (YT + 10) + '" font-size="7.6" fill="#41699b">' +
        '次数最多的一档</text>';
    }

    document.getElementById('c-n').innerHTML = s;
  }

  function drawD(res) {
    var s = svgOpen(), i;
    s = yAxisHint(s, '损伤贡献（相对）');

    var max = res.maxD > 0 ? res.maxD : 1;

    s += '<line x1="' + X0 + '" y1="' + BASE_Y + '" x2="' + (SW - XR) +
      '" y2="' + BASE_Y + '" stroke="#ddd7c8"/>';

    for (i = 0; i < 5; i++) {
      var d = res.rows[i].d;
      var pct = res.pct[i];
      var h = Math.max(1, d / max * PLOT_H);
      var x = X0 + i * BW + 4;
      var w = BW - 10;
      var col = pct >= 35 ? '#b05a51' : (pct >= 20 ? '#b26a39' : '#2f7d6b');
      var op = 0.35 + 0.5 * (d / max);
      var isHot = (i === res.hot);

      s += '<rect x="' + x.toFixed(1) + '" y="' + (BASE_Y - h).toFixed(1) +
        '" width="' + w.toFixed(1) + '" height="' + h.toFixed(1) +
        '" rx="2" fill="' + col + '" fill-opacity="' + op.toFixed(2) + '"/>';

      if (isHot) {
        s += '<rect x="' + (x - 1).toFixed(1) + '" y="' + (BASE_Y - h - 1).toFixed(1) +
          '" width="' + (w + 2).toFixed(1) + '" height="' + (h + 2).toFixed(1) +
          '" rx="3" fill="none" stroke="' + col + '" stroke-width="1.2" ' +
          'stroke-dasharray="3 2"/>';
      }

      s += '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (BASE_Y - h - 5).toFixed(1) +
        '" font-size="7.6" fill="' + col + '" text-anchor="middle" ' +
        'font-family="ui-monospace,monospace" font-weight="600">' +
        Math.round(pct) + '%</text>';

      s += '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (BASE_Y + 13) +
        '" font-size="7.4" fill="#9ba3a9" text-anchor="middle" ' +
        'font-family="ui-monospace,monospace">±' + Math.round(res.rows[i].S) + '</text>';
    }

    s += '<text x="' + (SW - XR) + '" y="' + (SH - 4) + '" font-size="7.2" ' +
      'fill="#9ba3a9" text-anchor="end">幅值 kN</text>';

    document.getElementById('c-d').innerHTML = s;
  }

  /* =========================================================
     三、侧栏
     ========================================================= */
  function drawSide(res, st) {
    var remainTxt, remainCls;

    if (res.remain > 9999) {
      remainTxt = '>9999'; remainCls = 'good';
    } else if (res.remain >= 1000) {
      remainTxt = (res.remain / 1000).toFixed(1) + 'k'; remainCls = 'good';
    } else {
      remainTxt = Math.round(res.remain); remainCls = res.remain < 200 ? 'bad' : 'warn';
    }

    var dCls = res.total > 0.4 ? 'bad' : res.total > 0.08 ? 'warn' : 'good';

    document.getElementById('metrics').innerHTML =
      '<div class="metric ' + dCls + '"><div class="l">D / 100 m</div>' +
        '<div class="v">' + res.total.toFixed(3) + '<small></small></div></div>' +
      '<div class="metric ' + remainCls + '"><div class="l">剩余进尺</div>' +
        '<div class="v">' + remainTxt + '<small>m</small></div></div>' +
      '<div class="metric ' + (res.pct[res.hot] > 40 ? 'bad' : 'warn') +
        '"><div class="l">最大单组贡献</div><div class="v">' +
        Math.round(res.pct[res.hot]) + '<small>%</small></div></div>' +
      '<div class="metric"><div class="l">最伤寿命的是</div><div class="v" ' +
        'style="font-size:13px">±' + Math.round(res.rows[res.hot].S) +
        '<small>kN</small></div></div>';

    /* 判词 */
    var vEl = document.getElementById('verdict');
    var busyS = Math.round(res.rows[res.busiest].S);
    var hotS = Math.round(res.rows[res.hot].S);
    var busyPct = Math.round(res.pct[res.busiest]);
    var hotPct = Math.round(res.pct[res.hot]);

    var html, cls;

    if (res.total > 0.8) {
      cls = 'bad';
      html = '总损伤 <b>D = ' + res.total.toFixed(2) + '</b>，已经超过 1.0 的失效线。' +
        '注意这不是"循环变多"造成的——<b>幅值每涨一倍，寿命掉到八分之一</b>，' +
        '所以是幅值在主导。';
    } else if (res.total > 0.25) {
      cls = 'warn';
      html = '总损伤 <b>D = ' + res.total.toFixed(2) + '</b>，剩余进尺只剩 ' +
        (res.remain > 9999 ? '很多' : Math.round(res.remain) + ' m') + '。' +
        '这时应该<b>排起钻窗口</b>，而不是继续钻。';
    } else {
      cls = 'ok';
      html = '次数最多的是 <b>±' + busyS + '</b>（' + busyPct + '% 的循环），' +
        '但最伤寿命的是 <b>±' + hotS + '</b>（占损伤 ' + hotPct + '%）。' +
        '<b>这就是为什么不能看峰值，必须做雨流计数</b>。';
    }

    if (res.busiest === res.hot) {
      html += ' 此时两者恰好是同一档——把幅值倍率拉低或拉高，它们就会分开。';
    }

    vEl.className = 'verdict ' + cls;
    vEl.innerHTML = html;

    /* 表格 */
    var rows = '', i;
    for (i = 0; i < 5; i++) {
      var r = res.rows[i];
      var nTxt = r.n >= 1000 ? (r.n / 1000).toFixed(1) + 'k' : Math.round(r.n);
      var NTxt = r.N >= 1e6 ? (r.N / 1e6).toFixed(1) + 'M'
        : r.N >= 1e3 ? (r.N / 1e3).toFixed(0) + 'k' : Math.round(r.N);
      rows += '<tr><td>±' + Math.round(r.S) + '</td><td>' + nTxt + '</td>' +
        '<td>' + NTxt + '</td><td class="' +
        (i === res.hot ? 'hot' : '') + '">' + r.d.toFixed(3) + '</td></tr>';
    }

    document.getElementById('tbl').innerHTML =
      '<thead><tr><th>幅值</th><th>次数</th><th>寿命N</th><th>损伤</th></tr></thead>' +
      '<tbody>' + rows + '</tbody>';
  }

  /* =========================================================
     四、主循环
     ========================================================= */
  var sAmp = document.getElementById('s-amp');
  var sCyc = document.getElementById('s-cyc');
  var sDls = document.getElementById('s-dls');
  var vAmp = document.getElementById('v-amp');
  var vCyc = document.getElementById('v-cyc');
  var vDls = document.getElementById('v-dls');

  var state = { amp: 100, cyc: 120, dls: 3 };

  function paint() {
    state.amp = Number(sAmp.value);
    state.cyc = Number(sCyc.value);
    state.dls = Number(sDls.value);

    vAmp.textContent = (state.amp / 100).toFixed(2);
    vCyc.textContent = state.cyc + '/100m';
    vDls.textContent = state.dls.toFixed(1) + '°/30m';

    var res = compute(state);
    drawN(res);
    drawD(res);
    drawSide(res, state);
  }

  sAmp.addEventListener('input', paint);
  sCyc.addEventListener('input', paint);
  sDls.addEventListener('input', paint);

  paint();

})();
</script>

</body>
</html>
