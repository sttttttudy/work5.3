<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>钻具失效预测 · 疲劳累积与时序损伤建模</title>
<style>
  :root{
    --jade:#2f8f7a; --jade-1:#eaf5f1; --jade-2:#c6e4da; --jade-3:#1f7261;
    --clay:#b4653f; --clay-1:#fbf1ea; --clay-2:#eed6c6;
    --ink:#1f2a30; --ink-1:#eef1f3; --ink-2:#d5dde1; --ink-3:#5b6b74; --ink-4:#9aa8b0;
    --bg:#f4f6f6; --panel:#ffffff; --danger:#c0392b; --danger-1:#fbeae7;
    --warn:#d4a017; --warn-1:#fdf8e7;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; padding:0; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); font-size:15px; line-height:1.6;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  .wrap{ height:100%; display:flex; flex-direction:column; background:var(--bg); }

  .topbar{
    height:42px; flex:0 0 auto; display:flex; align-items:center; gap:10px;
    padding:0 16px; background:var(--panel); border-bottom:1px solid var(--ink-2);
  }
  .topbar .dot{ width:10px; height:10px; border-radius:50%; background:var(--jade); box-shadow:0 0 0 3px var(--jade-1); }
  .topbar h1{ font-size:15px; font-weight:600; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .topbar .scene{ margin-left:auto; font-size:12px; color:var(--ink-4); font-family:ui-monospace,Menlo,monospace; }

  .panes{ flex:1 1 auto; min-height:0; position:relative; }
  .pane{ height:100%; overflow:auto; padding:12px; }
  .pane::-webkit-scrollbar{ width:8px; height:8px; }
  .pane::-webkit-scrollbar-thumb{ background:var(--ink-2); border-radius:4px; }

  .panel{
    background:var(--panel); border:1px solid var(--ink-2); border-radius:10px;
    display:flex; flex-direction:column; min-height:0; min-width:0; overflow:hidden;
  }
  .panel-title{
    flex:0 0 auto; font-size:13px; font-weight:600; color:var(--ink-3);
    padding:9px 14px 8px; border-bottom:1px solid var(--ink-1);
    display:flex; align-items:center; gap:7px;
  }
  .panel-title::before{ content:''; width:3px; height:14px; border-radius:2px; background:var(--jade); }
  .svg-box{ flex:1 1 auto; min-height:0; padding:5px 8px 7px; }
  .svg-box svg{ width:100%; height:100%; display:block; }

  .demo-layout{ display:flex; gap:12px; height:100%; min-height:0; }
  .panel-ctrl{ flex:0 0 246px; width:246px; }
  .ctrl-body{ flex:1 1 auto; min-height:0; overflow:auto; padding:10px 13px 14px; }

  .field{ margin-bottom:14px; }
  .field-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:5px; }
  .field-head span{ font-size:13px; color:var(--ink-3); }
  .field-head b{ font-size:13.5px; font-weight:600; color:var(--jade-3); font-variant-numeric:tabular-nums; font-family:ui-monospace,Menlo,monospace; }
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:5px; border-radius:3px;
    background:linear-gradient(90deg,var(--jade-2),var(--ink-1)); outline:none; cursor:pointer; margin:5px 0 0;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:17px; height:17px; border-radius:50%;
    background:var(--jade); border:2.5px solid #fff; box-shadow:0 1px 4px rgba(31,42,48,.28); cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:15px; height:15px; border-radius:50%; background:var(--jade);
    border:2.5px solid #fff; box-shadow:0 1px 4px rgba(31,42,48,.28); cursor:pointer;
  }

  .btn{
    width:100%; height:38px; border-radius:8px; font-size:13.5px; font-weight:600;
    font-family:inherit; cursor:pointer; border:1px solid transparent;
    transition:background .15s ease, border-color .15s ease;
  }
  .btn-primary{ background:var(--jade); color:#fff; box-shadow:0 2px 8px rgba(47,143,122,.24); }
  .btn-primary:hover{ background:var(--jade-3); }
  .btn-primary:disabled{ opacity:.62; cursor:progress; box-shadow:none; }

  .hint{
    margin-top:12px; padding:9px 11px; background:var(--jade-1);
    border:1px solid var(--jade-2); border-radius:8px;
    font-size:12.5px; line-height:1.65; color:var(--jade-3);
  }
  .hint b{ font-weight:600; }

  .demo-stage{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:12px; min-height:0; }
  .panel-main{ flex:1 1 auto; min-height:0; }
  .demo-bottom{ flex:0 0 210px; height:210px; display:flex; gap:12px; }
  .panel-signal{ flex:1.1 1 0; min-width:0; }
  .panel-met{ flex:1 1 0; min-width:0; }

  .metrics{ flex:1 1 auto; min-height:0; padding:4px 13px 8px; display:flex; flex-direction:column; justify-content:space-around; }
  .metric{ display:flex; align-items:center; gap:9px; padding:4px 0; border-bottom:1px dashed var(--ink-1); }
  .metric:last-child{ border-bottom:none; }
  .m-label{ flex:0 0 88px; font-size:12.5px; color:var(--ink-3); white-space:nowrap; }
  .m-value{ font-size:17px; font-weight:600; font-family:ui-monospace,Menlo,monospace; white-space:nowrap; }
  .m-value em{ font-style:normal; font-size:11.5px; font-weight:500; color:var(--ink-4); margin-left:1px; }
  .m-value.is-ok{ color:var(--jade-3); }
  .m-value.is-warn{ color:var(--warn); }
  .m-value.is-bad{ color:var(--danger); }
  .m-sub{ margin-left:auto; font-size:11.5px; color:var(--ink-4); text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .badge{ display:inline-flex; align-items:center; gap:5px; padding:2px 11px; border-radius:20px; font-size:13.5px; font-weight:600; }
  .badge::before{ content:''; width:7px; height:7px; border-radius:50%; background:currentColor; }
  .badge.ok{ color:var(--jade-3); background:var(--jade-1); }
  .badge.warn{ color:var(--warn); background:var(--warn-1); }
  .badge.bad{ color:var(--danger); background:var(--danger-1); }
</style>
</head>
<body>

<div class="wrap" id="wrap">
  <header class="topbar">
    <span class="dot"></span>
    <h1>钻具失效预测 · 疲劳累积与时序损伤建模</h1>
    <span class="scene">sceneId: s4-d4</span>
  </header>

  <div class="panes">
    <section class="pane active" id="pane-demo">
      <div class="demo-layout">
        <aside class="panel panel-ctrl">
          <div class="panel-title">工况参数</div>
          <div class="ctrl-body">
            <div class="field">
              <div class="field-head"><span>振动幅度 (RMS)</span><b id="v-vib">2.5 g</b></div>
              <input type="range" id="s-vib" min="0.5" max="6" step="0.1" value="2.5" />
            </div>
            <div class="field">
              <div class="field-head"><span>转速</span><b id="v-rpm">80 r/min</b></div>
              <input type="range" id="s-rpm" min="40" max="160" step="5" value="80" />
            </div>
            <div class="field">
              <div class="field-head"><span>钻压</span><b id="v-wob">80 kN</b></div>
              <input type="range" id="s-wob" min="30" max="180" step="5" value="80" />
            </div>

            <button class="btn btn-primary" id="btn-run">AI 预测剩余寿命</button>

            <div class="hint" style="margin-top:14px;">
              <b>技术组合：</b>时序特征提取（时序预测）+ Miner 疲劳累积（物理模型）+ 剩余寿命融合预测 + 起钻成本优化（优化算法）。知识图谱关联钻具型号与失效模式，NLP 生成建议文本。图像识别不参与。
            </div>
          </div>
        </aside>

        <div class="demo-stage">
          <section class="panel panel-main">
            <div class="panel-title">疲劳损伤累积曲线与剩余寿命预测</div>
            <div class="svg-box"><svg id="svg-main" viewBox="0 0 680 300" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg></div>
          </section>
          <div class="demo-bottom">
            <section class="panel panel-signal">
              <div class="panel-title">振动时序损伤特征</div>
              <div class="svg-box"><svg id="svg-signal" viewBox="0 0 300 160" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg></div>
            </section>
            <section class="panel panel-met">
              <div class="panel-title">寿命与风险指标</div>
              <div class="metrics">
                <div class="metric">
                  <div class="m-label">当前损伤度</div>
                  <div class="m-value" id="m-damage">0.0<em>%</em></div>
                  <div class="m-sub" id="m-damage-sub">Miner 累积</div>
                </div>
                <div class="metric">
                  <div class="m-label">剩余寿命</div>
                  <div class="m-value" id="m-life">0<em>h</em></div>
                  <div class="m-sub" id="m-life-sub">预计可用时间</div>
                </div>
                <div class="metric">
                  <div class="m-label">建议起钻</div>
                  <div class="m-value" id="m-action" style="font-size:14px; color:var(--ink-3);">—</div>
                  <div class="m-sub" id="m-action-sub">基于成本优化</div>
                </div>
                <div class="metric">
                  <div class="m-label">风险等级</div>
                  <div class="m-value" id="m-risk"><span class="badge ok">低</span></div>
                  <div class="m-sub" id="m-risk-sub">—</div>
                </div>
              </div>
            </section>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
(function () {
  'use strict';

  var state = {
    vib: 2.5,
    rpm: 80,
    wob: 80,
    baseDamage: 10,      // 已累积损伤（%）
    baseHours: 120,      // 已服役小时
    analyzing: false,
    result: null
  };

  var els = {}, listeners = [], timeouts = [], mounted = false;

  function q(id) { return document.getElementById(id); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function f1(n) { return isFinite(n) ? Number(n).toFixed(1) : '—'; }
  function f0(n) { return isFinite(n) ? Number(n).toFixed(0) : '—'; }

  /* 计算损伤速率与剩余寿命 */
  function computeDamage(vib, rpm, wob, baseDamage, baseHours) {
    // 简化模型：损伤速率与振动、转速、钻压正相关
    var rate = (vib / 2.5) * 1.0 + (rpm / 80) * 0.4 + (wob / 80) * 0.3;
    rate = Math.max(0.2, rate); // 每小时损伤百分比
    var currentDamage = baseDamage + rate * 0; // 当前损伤度为输入值
    var remainHours = (100 - currentDamage) / rate;
    // 限制范围
    remainHours = clamp(remainHours, 0, 2000);
    // 成本优化：起钻成本与失效风险
    var action = '继续钻进';
    if (remainHours < 20) action = '立即起钻';
    else if (remainHours < 50) action = '下一趟起钻';
    else if (remainHours < 100) action = '关注，准备起钻';
    // 风险等级
    var risk = '低';
    if (remainHours < 20) risk = '高';
    else if (remainHours < 50) risk = '中';
    // 生成建议文本
    var advice = '预计剩余寿命 ' + f0(remainHours) + ' 小时，建议' + action + '。';
    return {
      rate: rate,
      remainHours: remainHours,
      action: action,
      risk: risk,
      advice: advice
    };
  }

  /* 渲染主图：损伤累积曲线 */
  function renderMain() {
    var W = 680, H = 300;
    var ML = 60, MR = 30, MT = 20, MB = 35;
    var pw = W - ML - MR, ph = H - MT - MB;
    var p = ['<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#fff"/>'];

    var res = state.result || computeDamage(state.vib, state.rpm, state.wob, state.baseDamage, state.baseHours);
    var currentDamage = state.baseDamage;
    var totalHours = state.baseHours + res.remainHours;
    var hoursMax = Math.max(200, totalHours * 1.2);

    function tx(h) { return ML + h / hoursMax * pw; }
    function ty(d) { return MT + ph - d / 100 * ph; }

    // 网格
    for (var gi = 0; gi <= 5; gi++) {
      var gh = gi * hoursMax / 5;
      p.push('<line x1="' + tx(gh) + '" y1="' + MT + '" x2="' + tx(gh) + '" y2="' + (MT + ph) + '" stroke="#eef1f3" stroke-width="1"/>');
      p.push('<text x="' + tx(gh) + '" y="' + (MT + ph + 16) + '" text-anchor="middle" font-size="10" fill="#9aa8b0">' + f0(gh) + 'h</text>');
    }
    for (var gi = 0; gi <= 4; gi++) {
      var gd = gi * 25;
      p.push('<line x1="' + ML + '" y1="' + ty(gd) + '" x2="' + (ML + pw) + '" y2="' + ty(gd) + '" stroke="#eef1f3" stroke-width="1"/>');
      p.push('<text x="' + (ML - 8) + '" y="' + (ty(gd) + 4) + '" text-anchor="end" font-size="10" fill="#9aa8b0">' + gd + '%</text>');
    }

    // 历史损伤曲线（已服役）
    var histEnd = state.baseHours;
    p.push('<path d="M' + tx(0) + ',' + ty(0) + ' Q' + tx(histEnd/2) + ',' + ty(currentDamage*0.5) + ' ' + tx(histEnd) + ',' + ty(currentDamage) + '" fill="none" stroke="#5b6b74" stroke-width="2.5" stroke-linejoin="round"/>');

    // 预测损伤曲线（延伸）
    var predEnd = totalHours;
    p.push('<path d="M' + tx(histEnd) + ',' + ty(currentDamage) + ' Q' + tx(histEnd + res.remainHours/2) + ',' + ty(currentDamage + (100-currentDamage)/2) + ' ' + tx(predEnd) + ',' + ty(100) + '" fill="none" stroke="#2f8f7a" stroke-width="2.5" stroke-dasharray="6 4" stroke-linejoin="round"/>');

    // 失效阈值线
    p.push('<line x1="' + ML + '" y1="' + ty(100) + '" x2="' + (ML + pw) + '" y2="' + ty(100) + '" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 3"/>');
    p.push('<text x="' + (ML + pw - 4) + '" y="' + (ty(100) - 4) + '" text-anchor="end" font-size="9.5" fill="#c0392b">失效阈值 100%</text>');

    // 当前点
    p.push('<circle cx="' + tx(histEnd) + '" cy="' + ty(currentDamage) + '" r="5" fill="#5b6b74" stroke="#fff" stroke-width="2"/>');
    p.push('<text x="' + (tx(histEnd) + 8) + '" y="' + (ty(currentDamage) - 6) + '" font-size="10.5" fill="#1f2a30">当前</text>');

    // 预测终点
    p.push('<circle cx="' + tx(predEnd) + '" cy="' + ty(100) + '" r="4" fill="#2f8f7a" stroke="#fff" stroke-width="1.5"/>');
    p.push('<text x="' + (tx(predEnd) + 6) + '" y="' + (ty(100) - 6) + '" font-size="10" fill="#1f7261">预测失效</text>');

    // 图例
    var lgX = 20, lgY = 10;
    p.push('<rect x="' + lgX + '" y="' + lgY + '" width="170" height="46" rx="6" fill="#fff" fill-opacity="0.92" stroke="#e2e8ea" stroke-width="1"/>');
    p.push('<line x1="' + (lgX + 10) + '" y1="' + (lgY + 16) + '" x2="' + (lgX + 36) + '" y2="' + (lgY + 16) + '" stroke="#5b6b74" stroke-width="2.5"/>');
    p.push('<text x="' + (lgX + 42) + '" y="' + (lgY + 20) + '" font-size="10" fill="#5b6b74">已服役损伤</text>');
    p.push('<line x1="' + (lgX + 10) + '" y1="' + (lgY + 34) + '" x2="' + (lgX + 36) + '" y2="' + (lgY + 34) + '" stroke="#2f8f7a" stroke-width="2.5" stroke-dasharray="4 3"/>');
    p.push('<text x="' + (lgX + 42) + '" y="' + (lgY + 38) + '" font-size="10" fill="#1f7261">预测损伤</text>');

    return p.join('');
  }

  /* 渲染振动信号特征图 */
  function renderSignal() {
    var W = 300, H = 160;
    var ML = 40, MR = 15, MT = 20, MB = 28;
    var pw = W - ML - MR, ph = H - MT - MB;
    var p = ['<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#fff"/>'];

    // 生成振动时序（简化）
    var N = 120, data = [];
    for (var i = 0; i < N; i++) {
      data.push(state.vib * Math.sin(i * 0.3) + (Math.random() - 0.5) * 0.4);
    }
    var lo = -state.vib * 1.3, hi = state.vib * 1.3;
    function tx(i) { return ML + i / (N - 1) * pw; }
    function ty(v) { return MT + ph - (clamp(v, lo, hi) - lo) / (hi - lo) * ph; }

    // 零线
    p.push('<line x1="' + ML + '" y1="' + ty(0) + '" x2="' + (ML + pw) + '" y2="' + ty(0) + '" stroke="#d5dde1" stroke-width="1" stroke-dasharray="3 3"/>');

    // 波形
    var d = '';
    for (var j = 0; j < N; j++) {
      d += (j === 0 ? 'M' : 'L') + tx(j) + ',' + ty(data[j]);
    }
    p.push('<path d="' + d + '" fill="none" stroke="#b4653f" stroke-width="1.8" stroke-linejoin="round"/>');

    // RMS 线
    var rms = Math.sqrt(data.reduce(function(s, v) { return s + v * v; }, 0) / N);
    p.push('<line x1="' + ML + '" y1="' + ty(rms) + '" x2="' + (ML + pw) + '" y2="' + ty(rms) + '" stroke="#2f8f7a" stroke-width="1.5" stroke-dasharray="4 3"/>');
    p.push('<text x="' + (ML + pw - 4) + '" y="' + (ty(rms) - 4) + '" text-anchor="end" font-size="9.5" fill="#1f7261">RMS=' + f1(rms) + ' g</text>');

    p.push('<text x="' + (ML + pw / 2) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="10" fill="#5b6b74">振动时序（采样点）</text>');
    p.push('<text x="12" y="' + (MT + ph / 2) + '" text-anchor="middle" font-size="10" fill="#5b6b74" transform="rotate(-90 12 ' + (MT + ph / 2) + ')">加速度 (g)</text>');

    return p.join('');
  }

  function renderMetrics() {
    var res = state.result || computeDamage(state.vib, state.rpm, state.wob, state.baseDamage, state.baseHours);
    if (els.mDamage) {
      els.mDamage.innerHTML = f1(state.baseDamage) + '<em>%</em>';
      els.mDamage.className = 'm-value ' + (state.baseDamage < 50 ? 'is-ok' : (state.baseDamage < 80 ? 'is-warn' : 'is-bad'));
    }
    if (els.mLife) {
      els.mLife.innerHTML = f0(res.remainHours) + '<em>h</em>';
      els.mLife.className = 'm-value ' + (res.remainHours > 50 ? 'is-ok' : (res.remainHours > 20 ? 'is-warn' : 'is-bad'));
    }
    if (els.mAction) {
      els.mAction.textContent = res.action;
      els.mAction.style.color = res.action === '立即起钻' ? 'var(--danger)' : (res.action === '下一趟起钻' ? 'var(--warn)' : 'var(--ink-3)');
    }
    if (els.mRisk) {
      var cls = res.risk === '高' ? 'bad' : (res.risk === '中' ? 'warn' : 'ok');
      els.mRisk.innerHTML = '<span class="badge ' + cls + '">' + res.risk + '</span>';
      els.mRiskSub.textContent = res.advice;
    }
  }

  function updateUI() {
    if (els.svgMain) els.svgMain.innerHTML = renderMain();
    if (els.svgSignal) els.svgSignal.innerHTML = renderSignal();
    renderMetrics();
  }

  /* 交互 */
  function syncLabels() {
    if (els.vVib) els.vVib.textContent = f1(state.vib) + ' g';
    if (els.vRpm) els.vRpm.textContent = state.rpm + ' r/min';
    if (els.vWob) els.vWob.textContent = state.wob + ' kN';
  }

  function onVib() { state.vib = parseFloat(els.sVib.value); syncLabels(); updateUI(); }
  function onRpm() { state.rpm = parseInt(els.sRpm.value, 10); syncLabels(); updateUI(); }
  function onWob() { state.wob = parseInt(els.sWob.value, 10); syncLabels(); updateUI(); }

  function onRun() {
    if (state.analyzing) return;
    state.analyzing = true;
    els.btnRun.disabled = true;
    els.btnRun.textContent = '预测中…';
    setTimeout(function () {
      state.result = computeDamage(state.vib, state.rpm, state.wob, state.baseDamage, state.baseHours);
      updateUI();
      els.btnRun.disabled = false;
      els.btnRun.textContent = 'AI 预测剩余寿命';
      state.analyzing = false;
    }, 400);
  }

  function addL(el, ev, fn) { if (el) { el.addEventListener(ev, fn, false); listeners.push([el, ev, fn]); } }

  function init() {
    els.svgMain = q('svg-main'); els.svgSignal = q('svg-signal');
    els.sVib = q('s-vib'); els.vVib = q('v-vib');
    els.sRpm = q('s-rpm'); els.vRpm = q('v-rpm');
    els.sWob = q('s-wob'); els.vWob = q('v-wob');
    els.btnRun = q('btn-run');
    els.mDamage = q('m-damage'); els.mDamageSub = q('m-damage-sub');
    els.mLife = q('m-life'); els.mLifeSub = q('m-life-sub');
    els.mAction = q('m-action'); els.mActionSub = q('m-action-sub');
    els.mRisk = q('m-risk'); els.mRiskSub = q('m-risk-sub');

    addL(els.sVib, 'input', onVib);
    addL(els.sRpm, 'input', onRpm);
    addL(els.sWob, 'input', onWob);
    addL(els.btnRun, 'click', onRun);

    syncLabels();
    updateUI();
  }

  function destroy() {
    var i;
    for (i = 0; i < listeners.length; i++) { try { listeners[i][0].removeEventListener(listeners[i][1], listeners[i][2], false); } catch (e) {} }
    listeners = [];
    for (i = 0; i < timeouts.length; i++) clearTimeout(timeouts[i]);
    timeouts = [];
    if (els.svgMain) els.svgMain.innerHTML = '';
    if (els.svgSignal) els.svgSignal.innerHTML = '';
    els = {}; state.analyzing = false;
  }

  window.__CASE_MOUNT__ = function () {
    if (mounted) return;
    mounted = true;
    try { init(); } catch (e) { mounted = false; if (window.console && console.error) console.error('[s4-d4] mount failed:', e); }
  };
  window.__CASE_UNMOUNT__ = function () {
    if (!mounted) return;
    mounted = false;
    try { destroy(); } catch (e) { if (window.console && console.error) console.error('[s4-d4] unmount failed:', e); }
  };

  function boot() { if (!mounted) window.__CASE_MOUNT__(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, false);
  else boot();
  window.addEventListener('pagehide', function () { window.__CASE_UNMOUNT__(); }, false);

})();
</script>
