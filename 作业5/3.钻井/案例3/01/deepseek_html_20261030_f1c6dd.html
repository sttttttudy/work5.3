<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>井眼轨迹智能控制 · 模型预测控制与地层响应学习</title>
<style>
  :root{
    --jade:#2f8f7a; --jade-1:#eaf5f1; --jade-2:#c6e4da; --jade-3:#1f7261;
    --clay:#b4653f; --clay-1:#fbf1ea; --clay-2:#eed6c6;
    --ink:#1f2a30; --ink-1:#eef1f3; --ink-2:#d5dde1; --ink-3:#5b6b74; --ink-4:#9aa8b0;
    --bg:#f4f6f6; --panel:#ffffff; --danger:#c0392b; --danger-1:#fbeae7;
    --warn:#d4a017; --warn-1:#fdf8e7;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; padding:0; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); font-size:15px; line-height:1.6;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  .wrap{ height:100%; display:flex; flex-direction:column; background:var(--bg); }

  .topbar{
    height:42px; flex:0 0 auto; display:flex; align-items:center; gap:10px;
    padding:0 16px; background:var(--panel); border-bottom:1px solid var(--ink-2);
  }
  .topbar .dot{ width:10px; height:10px; border-radius:50%; background:var(--jade); box-shadow:0 0 0 3px var(--jade-1); }
  .topbar h1{ font-size:15px; font-weight:600; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .topbar .scene{ margin-left:auto; font-size:12px; color:var(--ink-4); font-family:ui-monospace,Menlo,monospace; }

  .panes{ flex:1 1 auto; min-height:0; position:relative; }
  .pane{ height:100%; overflow:auto; padding:12px; }
  .pane::-webkit-scrollbar{ width:8px; height:8px; }
  .pane::-webkit-scrollbar-thumb{ background:var(--ink-2); border-radius:4px; }

  .panel{
    background:var(--panel); border:1px solid var(--ink-2); border-radius:10px;
    display:flex; flex-direction:column; min-height:0; min-width:0; overflow:hidden;
  }
  .panel-title{
    flex:0 0 auto; font-size:13px; font-weight:600; color:var(--ink-3);
    padding:9px 14px 8px; border-bottom:1px solid var(--ink-1);
    display:flex; align-items:center; gap:7px;
  }
  .panel-title::before{ content:''; width:3px; height:14px; border-radius:2px; background:var(--jade); }
  .svg-box{ flex:1 1 auto; min-height:0; padding:5px 8px 7px; }
  .svg-box svg{ width:100%; height:100%; display:block; }

  .demo-layout{ display:flex; gap:12px; height:100%; min-height:0; }
  .panel-ctrl{ flex:0 0 246px; width:246px; }
  .ctrl-body{ flex:1 1 auto; min-height:0; overflow:auto; padding:10px 13px 14px; }

  .scenario-list { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  .btn-scn {
    width:100%; height:34px; border-radius:6px; font-size:12.5px; font-weight:600;
    font-family:inherit; cursor:pointer; border:1px solid var(--ink-2);
    background:#fff; color:var(--ink-3); text-align:left; padding:0 10px;
    transition:all .15s ease;
  }
  .btn-scn:hover { background:var(--ink-1); }
  .btn-scn.active { border-color:var(--jade); background:var(--jade-1); color:var(--jade-3); }

  .field{ margin-bottom:14px; }
  .field-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:5px; }
  .field-head span{ font-size:13px; color:var(--ink-3); }
  .field-head b{ font-size:13.5px; font-weight:600; color:var(--jade-3); font-variant-numeric:tabular-nums; font-family:ui-monospace,Menlo,monospace; }
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:5px; border-radius:3px;
    background:linear-gradient(90deg,var(--jade-2),var(--ink-1)); outline:none; cursor:pointer; margin:5px 0 0;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:17px; height:17px; border-radius:50%;
    background:var(--jade); border:2.5px solid #fff; box-shadow:0 1px 4px rgba(31,42,48,.28); cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:15px; height:15px; border-radius:50%; background:var(--jade);
    border:2.5px solid #fff; box-shadow:0 1px 4px rgba(31,42,48,.28); cursor:pointer;
  }

  .btn{
    width:100%; height:38px; border-radius:8px; font-size:13.5px; font-weight:600;
    font-family:inherit; cursor:pointer; border:1px solid transparent;
    transition:background .15s ease, border-color .15s ease;
  }
  .btn-primary{ background:var(--jade); color:#fff; box-shadow:0 2px 8px rgba(47,143,122,.24); }
  .btn-primary:hover{ background:var(--jade-3); }
  .btn-primary:disabled{ opacity:.62; cursor:progress; box-shadow:none; }

  .hint{
    margin-top:12px; padding:9px 11px; background:var(--jade-1);
    border:1px solid var(--jade-2); border-radius:8px;
    font-size:12.5px; line-height:1.65; color:var(--jade-3);
  }
  .hint b{ font-weight:600; }

  .demo-stage{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:12px; min-height:0; }
  .panel-main{ flex:1 1 auto; min-height:0; }
  .demo-bottom{ flex:0 0 210px; height:210px; display:flex; gap:12px; }
  .panel-curve{ flex:1.1 1 0; min-width:0; }
  .panel-met{ flex:1 1 0; min-width:0; }

  .metrics{ flex:1 1 auto; min-height:0; padding:4px 13px 8px; display:flex; flex-direction:column; justify-content:space-around; }
  .metric{ display:flex; align-items:center; gap:9px; padding:4px 0; border-bottom:1px dashed var(--ink-1); }
  .metric:last-child{ border-bottom:none; }
  .m-label{ flex:0 0 88px; font-size:12.5px; color:var(--ink-3); white-space:nowrap; }
  .m-value{ font-size:17px; font-weight:600; font-family:ui-monospace,Menlo,monospace; white-space:nowrap; }
  .m-value em{ font-style:normal; font-size:11.5px; font-weight:500; color:var(--ink-4); margin-left:1px; }
  .m-value.is-ok{ color:var(--jade-3); }
  .m-value.is-warn{ color:var(--warn); }
  .m-value.is-bad{ color:var(--danger); }
  .m-sub{ margin-left:auto; font-size:11.5px; color:var(--ink-4); text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .badge{ display:inline-flex; align-items:center; gap:5px; padding:2px 11px; border-radius:20px; font-size:13.5px; font-weight:600; }
  .badge::before{ content:''; width:7px; height:7px; border-radius:50%; background:currentColor; }
  .badge.ok{ color:var(--jade-3); background:var(--jade-1); }
  .badge.warn{ color:var(--warn); background:var(--warn-1); }
  .badge.bad{ color:var(--danger); background:var(--danger-1); }
</style>
</head>
<body>

<div class="wrap" id="wrap">
  <header class="topbar">
    <span class="dot"></span>
    <h1>井眼轨迹智能控制 · 模型预测控制与地层响应学习</h1>
    <span class="scene">sceneId: s4-d3</span>
  </header>

  <div class="panes">
    <section class="pane active" id="pane-demo">
      <div class="demo-layout">
        <aside class="panel panel-ctrl">
          <div class="panel-title">控制参数</div>
          <div class="ctrl-body">
            <div class="scenario-list" id="scenario-list">
              <button class="btn-scn active" data-scn="normal">正常地层</button>
              <button class="btn-scn" data-scn="dipping">地层倾角突变</button>
              <button class="btn-scn" data-scn="target">靶点横向偏移</button>
            </div>

            <div class="field">
              <div class="field-head"><span>工具面角</span><b id="v-toolface">45°</b></div>
              <input type="range" id="s-toolface" min="0" max="90" step="1" value="45" />
            </div>
            <div class="field">
              <div class="field-head"><span>滑动段长度</span><b id="v-slide">18 m</b></div>
              <input type="range" id="s-slide" min="5" max="40" step="1" value="18" />
            </div>

            <button class="btn btn-primary" id="btn-run">AI 推荐控制</button>

            <div class="hint" style="margin-top:14px;">
              <b>技术组合：</b>MPC 滚动优化（优化算法）+ 地层响应预测（时序预测）+ 地质约束（知识图谱）+ 建议文本生成（NLP）。图像识别不参与本场景。
            </div>
          </div>
        </aside>

        <div class="demo-stage">
          <section class="panel panel-main">
            <div class="panel-title">井眼轨迹剖面与靶区窗口</div>
            <div class="svg-box"><svg id="svg-main" viewBox="0 0 680 320" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg></div>
          </section>
          <div class="demo-bottom">
            <section class="panel panel-curve">
              <div class="panel-title">预测轨迹横向偏差（沿井深）</div>
              <div class="svg-box"><svg id="svg-curve" viewBox="0 0 300 160" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg></div>
            </section>
            <section class="panel panel-met">
              <div class="panel-title">控制指标</div>
              <div class="metrics">
                <div class="metric">
                  <div class="m-label">靶点横向偏差</div>
                  <div class="m-value" id="m-dev">0.0<em>m</em></div>
                  <div class="m-sub" id="m-dev-sub">越接近 0 越好</div>
                </div>
                <div class="metric">
                  <div class="m-label">最大狗腿度</div>
                  <div class="m-value" id="m-dls">0.0<em>°/30m</em></div>
                  <div class="m-sub" id="m-dls-sub">上限 3.0</div>
                </div>
                <div class="metric">
                  <div class="m-label">预测摩阻</div>
                  <div class="m-value" id="m-friction">0.0<em>kN</em></div>
                  <div class="m-sub" id="m-friction-sub">与狗腿度正相关</div>
                </div>
                <div class="metric">
                  <div class="m-label">方案状态</div>
                  <div class="m-value" id="m-status"><span class="badge ok">可行</span></div>
                  <div class="m-sub" id="m-status-sub">—</div>
                </div>
              </div>
            </section>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
(function () {
  'use strict';

  var MAX_DEPTH = 2200;
  var TARGET_T = 2000;
  var state = {
    scenario: 'normal',
    toolface: 45,
    slide: 18,
    startX: 100,
    startY: 1500,
    startIncl: 25,
    targetX: 300
  };
  var els = {}, listeners = [], timeouts = [], mounted = false;

  function q(id) { return document.getElementById(id); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function f1(n) { return isFinite(n) ? Number(n).toFixed(1) : '—'; }
  function f0(n) { return isFinite(n) ? Number(n).toFixed(0) : '—'; }

  function getTargetX() {
    if (state.scenario === 'target') return 380;
    return 300;
  }

  /* 轨迹预测：从当前点，按工具面角与滑动段长生成圆弧段 */
  function predictTrajectory(toolface, slide, scen) {
    var points = [];
    var x = state.startX, y = state.startY;
    var incl = state.startIncl * Math.PI / 180; // 当前井斜角
    var step = 1;
    var total = slide;
    // 工具面角映射为造斜方向权重
    var turn = (toolface / 90) * 0.045; // 每米角度变化（弧度），可调
    if (scen === 'dipping') turn *= 0.6; // 地层倾角影响，造斜效率降低

    for (var d = 0; d <= total; d += step) {
      points.push({ x: x, y: y });
      var dIncl = turn * step;
      incl += dIncl;
      x += Math.sin(incl) * step;
      y += Math.cos(incl) * step;
    }
    return points;
  }

  /* 计算指标 */
  function computeMetrics(points) {
    var last = points[points.length - 1];
    var dev = last.x - getTargetX();
    // 狗腿度：由工具面角与滑动段长度估算
    var dls = (state.toolface / 90) * 10 * (18 / state.slide);
    dls = clamp(dls, 0.5, 8);
    // 摩阻与狗腿度正相关
    var friction = 5 + dls * 4 + (state.slide < 10 ? 8 : 0);
    var ok = Math.abs(dev) < 25 && dls <= 3.0;
    return { dev: dev, dls: dls, friction: friction, ok: ok, endX: last.x, endY: last.y };
  }

  /* 主图 */
  function renderMain() {
    var W = 680, H = 320;
    var ML = 70, MR = 30, MT = 20, MB = 35;
    var pw = W - ML - MR, ph = H - MT - MB;

    var xMin = -50, xMax = 500;
    function px(x) { return ML + (x - xMin) / (xMax - xMin) * pw; }
    function py(y) { return MT + (y / MAX_DEPTH) * ph; }

    var p = ['<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#fff"/>'];

    // 地层背景
    var layers = [
      { d0: 0, d1: 600, fill: '#f7f1e8', name: '第四系' },
      { d0: 600, d1: 1200, fill: '#eaf0ec', name: '泥岩' },
      { d0: 1200, d1: 1800, fill: '#f8f0e3', name: '砂岩' },
      { d0: 1800, d1: 2200, fill: '#e9eff5', name: '灰岩' }
    ];
    for (var i = 0; i < layers.length; i++) {
      var l = layers[i];
      var y0 = py(l.d0), y1 = py(l.d1);
      p.push('<rect x="' + ML + '" y="' + y0 + '" width="' + pw + '" height="' + (y1 - y0) + '" fill="' + l.fill + '"/>');
      p.push('<line x1="' + ML + '" y1="' + y1 + '" x2="' + (ML + pw) + '" y2="' + y1 + '" stroke="#e0e6e9" stroke-width="1"/>');
      p.push('<text x="' + (ML + 8) + '" y="' + ((y0 + y1) / 2 + 4) + '" font-size="10" fill="#aab6bd">' + l.name + '</text>');
    }

    // 网格与轴
    for (var gx = 0; gx <= 400; gx += 100) {
      p.push('<line x1="' + px(gx) + '" y1="' + MT + '" x2="' + px(gx) + '" y2="' + (MT + ph) + '" stroke="#eef1f3" stroke-width="1"/>');
      p.push('<text x="' + px(gx) + '" y="' + (MT + ph + 16) + '" text-anchor="middle" font-size="10" fill="#9aa8b0">' + gx + 'm</text>');
    }
    for (var gy = 0; gy <= 2000; gy += 500) {
      p.push('<line x1="' + ML + '" y1="' + py(gy) + '" x2="' + (ML + pw) + '" y2="' + py(gy) + '" stroke="#eef1f3" stroke-width="1"/>');
      p.push('<text x="' + (ML - 8) + '" y="' + (py(gy) + 4) + '" text-anchor="end" font-size="10" fill="#9aa8b0">' + gy + '</text>');
    }

    // 当前点
    var sx = state.startX, sy = state.startY;
    p.push('<circle cx="' + px(sx) + '" cy="' + py(sy) + '" r="5" fill="#1f2a30"/>');
    p.push('<text x="' + (px(sx) + 8) + '" y="' + (py(sy) - 6) + '" font-size="10.5" fill="#1f2a30">当前钻头</text>');

    // 靶区矩形
    var tx = getTargetX();
    var ty = TARGET_T;
    var tw = 80, th = 200;
    p.push('<rect x="' + px(tx - tw / 2) + '" y="' + py(ty - th / 2) + '" width="' + (px(tx + tw / 2) - px(tx - tw / 2)) + '" height="' + (py(ty + th / 2) - py(ty - th / 2)) + '" fill="rgba(47,143,122,0.12)" stroke="#2f8f7a" stroke-width="1.5" stroke-dasharray="4 3" rx="3"/>');
    p.push('<text x="' + (px(tx + tw / 2) + 6) + '" y="' + (py(ty) + 4) + '" font-size="10" fill="#1f7261">靶区</text>');

    // 预测轨迹
    var pts = predictTrajectory(state.toolface, state.slide, state.scenario);
    var d = '';
    for (var j = 0; j < pts.length; j++) {
      d += (j === 0 ? 'M' : 'L') + px(pts[j].x) + ',' + py(pts[j].y);
    }
    var metrics = computeMetrics(pts);
    var color = metrics.ok ? '#2f8f7a' : '#c0392b';
    p.push('<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>');
    p.push('<circle cx="' + px(metrics.endX) + '" cy="' + py(metrics.endY) + '" r="4.5" fill="' + color + '" stroke="#fff" stroke-width="1.5"/>');

    // 图例
    p.push('<rect x="' + (W - 180) + '" y="' + (MT + 6) + '" width="160" height="46" rx="6" fill="#fff" fill-opacity="0.92" stroke="#e2e8ea" stroke-width="1"/>');
    p.push('<line x1="' + (W - 170) + '" y1="' + (MT + 20) + '" x2="' + (W - 150) + '" y2="' + (MT + 20) + '" stroke="#2f8f7a" stroke-width="3"/>');
    p.push('<text x="' + (W - 144) + '" y="' + (MT + 24) + '" font-size="10" fill="#5b6b74">可行轨迹</text>');
    p.push('<line x1="' + (W - 170) + '" y1="' + (MT + 38) + '" x2="' + (W - 150) + '" y2="' + (MT + 38) + '" stroke="#c0392b" stroke-width="3"/>');
    p.push('<text x="' + (W - 144) + '" y="' + (MT + 42) + '" font-size="10" fill="#c0392b">超限轨迹</text>');

    return p.join('');
  }

  /* 底部左：横向偏差曲线 */
  function renderCurve() {
    var W = 300, H = 160;
    var ML = 40, MR = 15, MT = 20, MB = 28;
    var pw = W - ML - MR, ph = H - MT - MB;
    var p = ['<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#fff"/>'];

    var pts = predictTrajectory(state.toolface, state.slide, state.scenario);
    var targetX = getTargetX();

    // 只画后段偏差
    var devs = [];
    for (var i = 0; i < pts.length; i++) {
      // 以同一深度的目标中心线为参考，简单用终点目标X线性插值
      var y = pts[i].y;
      var refX = state.startX + (targetX - state.startX) * ((y - state.startY) / (TARGET_T - state.startY));
      devs.push(pts[i].x - refX);
    }

    var maxAbs = 1;
    for (var k = 0; k < devs.length; k++) maxAbs = Math.max(maxAbs, Math.abs(devs[k]));
    maxAbs = Math.ceil(maxAbs / 10) * 10;

    function px(t) { return ML + t / (devs.length - 1) * pw; }
    function py(v) { return MT + ph / 2 - v / maxAbs * (ph / 2); }

    // 零线
    p.push('<line x1="' + ML + '" y1="' + py(0) + '" x2="' + (ML + pw) + '" y2="' + py(0) + '" stroke="#d5dde1" stroke-width="1" stroke-dasharray="4 3"/>');
    p.push('<text x="' + (ML - 4) + '" y="' + (py(0) + 4) + '" text-anchor="end" font-size="9" fill="#9aa8b0">0</text>');

    // 曲线
    var d = '';
    for (var j = 0; j < devs.length; j++) {
      d += (j === 0 ? 'M' : 'L') + px(j) + ',' + py(devs[j]);
    }
    p.push('<path d="' + d + '" fill="none" stroke="#b4653f" stroke-width="2" stroke-linejoin="round"/>');

    p.push('<text x="' + (ML + pw / 2) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="10" fill="#5b6b74">滑动段长度 (m)</text>');
    p.push('<text x="12" y="' + (MT + ph / 2) + '" text-anchor="middle" font-size="10" fill="#5b6b74" transform="rotate(-90 12 ' + (MT + ph / 2) + ')">横向偏差 (m)</text>');

    return p.join('');
  }

  function renderMetrics() {
    var pts = predictTrajectory(state.toolface, state.slide, state.scenario);
    var m = computeMetrics(pts);

    if (els.mDev) {
      els.mDev.innerHTML = f1(m.dev) + '<em>m</em>';
      els.mDev.className = 'm-value ' + (Math.abs(m.dev) < 15 ? 'is-ok' : (Math.abs(m.dev) < 25 ? 'is-warn' : 'is-bad'));
    }
    if (els.mDls) {
      els.mDls.innerHTML = f1(m.dls) + '<em>°/30m</em>';
      els.mDls.className = 'm-value ' + (m.dls <= 3 ? 'is-ok' : (m.dls <= 4 ? 'is-warn' : 'is-bad'));
    }
    if (els.mFriction) {
      els.mFriction.innerHTML = f1(m.friction) + '<em>kN</em>';
      els.mFriction.className = 'm-value ' + (m.friction < 15 ? 'is-ok' : (m.friction < 20 ? 'is-warn' : 'is-bad'));
    }
    if (els.mStatus) {
      if (m.ok) {
        els.mStatus.innerHTML = '<span class="badge ok">可行</span>';
        els.mStatusSub.textContent = '偏差与狗腿度均达标';
      } else {
        els.mStatus.innerHTML = '<span class="badge bad">需调整</span>';
        els.mStatusSub.textContent = Math.abs(m.dev) >= 25 ? '靶点偏差过大' : '狗腿度超限';
      }
    }
  }

  function updateUI() {
    if (els.svgMain) els.svgMain.innerHTML = renderMain();
    if (els.svgCurve) els.svgCurve.innerHTML = renderCurve();
    renderMetrics();
  }

  /* 交互 */
  function syncLabels() {
    if (els.vToolface) els.vToolface.textContent = state.toolface + '°';
    if (els.vSlide) els.vSlide.textContent = state.slide + ' m';
  }

  function onToolface() { state.toolface = parseInt(els.sToolface.value, 10); syncLabels(); updateUI(); }
  function onSlide() { state.slide = parseInt(els.sSlide.value, 10); syncLabels(); updateUI(); }

  function onScenario(scn) {
    state.scenario = scn;
    var btns = document.querySelectorAll('.btn-scn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('active', btns[i].getAttribute('data-scn') === scn);
    }
    updateUI();
  }

  function onRun() {
    if (els.btnRun.disabled) return;
    els.btnRun.disabled = true;
    els.btnRun.textContent = '优化中…';
    setTimeout(function () {
      // 简化 MPC：网格搜索工具面与滑动段
      var best = { t: 45, s: 18, score: -1e9 };
      for (var t = 10; t <= 80; t += 5) {
        for (var s = 8; s <= 40; s += 2) {
          var pts = predictTrajectory(t, s, state.scenario);
          var m = computeMetrics(pts);
          var score = -Math.abs(m.dev) * 2 - Math.max(0, m.dls - 3) * 50 - m.friction * 0.5;
          if (score > best.score) best = { t: t, s: s, score: score };
        }
      }
      state.toolface = best.t;
      state.slide = best.s;
      els.sToolface.value = state.toolface;
      els.sSlide.value = state.slide;
      syncLabels();
      updateUI();
      els.btnRun.disabled = false;
      els.btnRun.textContent = 'AI 推荐控制';
    }, 300);
  }

  function addL(el, ev, fn) { if (el) { el.addEventListener(ev, fn, false); listeners.push([el, ev, fn]); } }

  function init() {
    els.svgMain = q('svg-main'); els.svgCurve = q('svg-curve');
    els.sToolface = q('s-toolface'); els.vToolface = q('v-toolface');
    els.sSlide = q('s-slide'); els.vSlide = q('v-slide');
    els.btnRun = q('btn-run');
    els.mDev = q('m-dev'); els.mDevSub = q('m-dev-sub');
    els.mDls = q('m-dls'); els.mDlsSub = q('m-dls-sub');
    els.mFriction = q('m-friction'); els.mFrictionSub = q('m-friction-sub');
    els.mStatus = q('m-status'); els.mStatusSub = q('m-status-sub');

    addL(els.sToolface, 'input', onToolface);
    addL(els.sSlide, 'input', onSlide);
    addL(els.btnRun, 'click', onRun);

    var btns = document.querySelectorAll('.btn-scn');
    for (var i = 0; i < btns.length; i++) {
      (function (btn) { addL(btn, 'click', function () { onScenario(btn.getAttribute('data-scn')); }); })(btns[i]);
    }

    syncLabels();
    updateUI();
  }

  function destroy() {
    var i;
    for (i = 0; i < listeners.length; i++) { try { listeners[i][0].removeEventListener(listeners[i][1], listeners[i][2], false); } catch (e) {} }
    listeners = [];
    for (i = 0; i < timeouts.length; i++) clearTimeout(timeouts[i]);
    timeouts = [];
    if (els.svgMain) els.svgMain.innerHTML = '';
    if (els.svgCurve) els.svgCurve.innerHTML = '';
    els = {};
  }

  window.__CASE_MOUNT__ = function () {
    if (mounted) return;
    mounted = true;
    try { init(); } catch (e) { mounted = false; if (window.console && console.error) console.error('[s4-d3] mount failed:', e); }
  };
  window.__CASE_UNMOUNT__ = function () {
    if (!mounted) return;
    mounted = false;
    try { destroy(); } catch (e) { if (window.console && console.error) console.error('[s4-d3] unmount failed:', e); }
  };

  function boot() { if (!mounted) window.__CASE_MOUNT__(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, false);
  else boot();
  window.addEventListener('pagehide', function () { window.__CASE_UNMOUNT__(); }, false);

})();
</script>
</body>
