<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>录井报告自动生成 · 示范</title>
<style>
  :root{
    --jade:#2f7d6b; --jade-d:#235f51; --jade-l:#e6f1ec;
    --clay:#b26a39; --clay-l:#f8ecdf;
    --opt:#41699b; --opt-l:#e7eef9;
    --plum:#7e5a8d;
    --ink:#242b2e; --ink-2:#4d565b; --ink-3:#79828a; --ink-4:#9ba3a9;
    --line:#e9e4d8; --line-2:#ddd7c8; --line-3:#c9c2b0;
    --card:#ffffff; --soft:#fdfcf9; --paper:#fbfaf6;
    --ok:#3f8560; --warn:#a97a1c; --bad:#b05a51;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; padding:16px 18px 22px; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:13px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .kick{ font-family:var(--mono); font-size:9px; letter-spacing:.15em;
    text-transform:uppercase; color:var(--jade-d); }
  h1{ font-size:17px; font-weight:650; margin:7px 0 0; letter-spacing:-.01em; }
  .desc{ margin:7px 0 0; font-size:12px; color:var(--ink-3);
    line-height:1.7; max-width:84ch; }
  .desc b{ color:var(--ink-2); }

  .grid{ display:grid; grid-template-columns:minmax(0,1fr) 252px;
    gap:12px; margin-top:14px; align-items:start; }

  /* ---------- 报告区 ---------- */
  .stage{ background:var(--card); border:1px solid var(--line);
    border-radius:9px; padding:10px 11px 9px; min-width:0; }
  .repHead{ display:flex; align-items:baseline; justify-content:space-between;
    gap:10px; padding-bottom:7px; border-bottom:1px solid var(--line); }
  .repHead .t{ font-size:11.4px; font-weight:600; color:var(--ink); }
  .repHead .t span{ font-family:var(--mono); font-size:8.4px; color:var(--ink-4);
    font-weight:400; margin-left:6px; }
  .repHead .mode{ font-family:var(--mono); font-size:8.6px; letter-spacing:.06em;
    padding:2px 7px; border-radius:8px; white-space:nowrap; }
  .mode.slot{ background:var(--jade-l); color:var(--jade-d); }
  .mode.free{ background:#f9e9e5; color:var(--bad); }
  .mode.mix{ background:#f9efd7; color:#7d5a12; }

  .rep{ max-height:330px; overflow-y:auto; margin:0 -4px; padding:2px 4px 0; }
  .line{ display:flex; gap:8px; padding:6px 7px; border-radius:6px;
    border:1px solid transparent; cursor:pointer; transition:background .12s; }
  .line:hover{ background:var(--soft); }
  .line.sel{ background:#f7f5ee; border-color:var(--line-2); }
  .line .no{ flex:0 0 15px; font-family:var(--mono); font-size:8.2px;
    color:var(--ink-4); padding-top:2px; }
  .line .body{ flex:1; min-width:0; }
  .line .tx{ font-size:11.4px; line-height:1.78; color:var(--ink-2); }
  .line.freeTx .tx{ color:var(--ink-2); }
  .tx em{ font-style:normal; background:#f9e9e5; color:var(--bad);
    border-bottom:1px dotted var(--bad); border-radius:2px; padding:0 1px; }
  .chip{ display:inline-block; margin-top:4px; font-size:8.4px;
    padding:1px 6px; border-radius:8px; letter-spacing:.02em; }
  .chip.ok{ background:var(--jade-l); color:var(--jade-d); }
  .chip.none{ background:#f9e9e5; color:var(--bad); }

  .cap{ font-size:9.8px; color:var(--ink-4); margin-top:7px; line-height:1.6; }
  .cap b{ color:var(--ink-2); }

  /* ---------- 核对卡 ---------- */
  .check{ margin-top:10px; border:1px solid var(--line); border-radius:9px;
    background:var(--soft); padding:9px 11px; }
  .check h6{ margin:0 0 6px; font-family:var(--mono); font-size:7.6px;
    letter-spacing:.1em; color:var(--ink-4); font-weight:400; text-transform:uppercase; }
  .check .row{ display:flex; gap:8px; font-size:10px; line-height:1.7;
    color:var(--ink-2); }
  .check .row .k{ flex:0 0 62px; color:var(--ink-4); font-family:var(--mono);
    font-size:8.6px; padding-top:1px; }
  .check .row .v{ flex:1; min-width:0; }
  .check .v em{ font-style:normal; color:var(--bad); font-weight:600; }
  .check table{ width:100%; border-collapse:collapse; font-size:9.6px; margin-top:4px; }
  .check td{ padding:2px 0; border-bottom:1px solid var(--line); color:var(--ink-3); }
  .check tr:last-child td{ border-bottom:0; }
  .check td:last-child{ text-align:right; font-family:var(--mono);
    color:var(--ink-2); white-space:nowrap; }

  /* ---------- 侧栏 ---------- */
  .side{ display:flex; flex-direction:column; gap:8px; min-width:0; }
  .metrics{ display:grid; grid-template-columns:1fr 1fr; gap:1px;
    background:var(--line); border:1px solid var(--line);
    border-radius:8px; overflow:hidden; }
  .metric{ background:var(--card); padding:8px 9px; }
  .metric .l{ font-family:var(--mono); font-size:7.4px; letter-spacing:.07em;
    color:var(--ink-4); white-space:nowrap; }
  .metric .v{ font-family:var(--mono); font-size:15px; margin-top:4px;
    line-height:1; color:var(--ink); }
  .metric .v small{ font-size:8px; color:var(--ink-4); margin-left:2px; }
  .metric.good .v{ color:var(--ok); }
  .metric.warn .v{ color:var(--warn); }
  .metric.bad .v{ color:var(--bad); }

  .verdict{ font-size:11.2px; line-height:1.7; color:var(--ink-2);
    border-left:2.5px solid var(--line-2); padding-left:9px; }
  .verdict b{ color:var(--ink); }
  .verdict.ok{ border-color:var(--ok); }
  .verdict.warn{ border-color:var(--warn); }
  .verdict.bad{ border-color:var(--bad); }

  .card{ border:1px solid var(--line); border-radius:8px;
    background:var(--soft); padding:9px 10px; }
  .card h5{ margin:0 0 6px; font-family:var(--mono); font-size:7.6px;
    letter-spacing:.1em; color:var(--ink-4); font-weight:400; text-transform:uppercase; }
  table.src{ width:100%; border-collapse:collapse; font-size:9.4px; }
  table.src td{ padding:2.5px 0; border-bottom:1px solid var(--line);
    color:var(--ink-3); }
  table.src tr:last-child td{ border-bottom:0; }
  table.src td:last-child{ text-align:right; font-family:var(--mono); width:34px; }
  table.src tr.zero td{ color:var(--ink-4); opacity:.62; }
  table.src td.hit{ color:var(--ok); }
  table.src td.miss{ color:var(--bad); }

  /* ---------- 控件 ---------- */
  .ctrls{ display:flex; flex-wrap:wrap; align-items:center; gap:16px;
    margin-top:11px; padding:11px 14px; background:var(--card);
    border:1px solid var(--line); border-radius:9px; }
  .ctl{ display:flex; align-items:center; gap:9px; font-size:11.5px; color:var(--ink-2); }
  .ctl label{ font-family:var(--mono); font-size:9px; letter-spacing:.06em;
    color:var(--ink-3); white-space:nowrap; }
  .ctl input[type=range]{ -webkit-appearance:none; appearance:none;
    width:190px; height:4px; border-radius:2px; background:var(--line-2);
    outline:none; cursor:pointer; }
  .ctl input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none;
    width:15px; height:15px; border-radius:50%; background:var(--jade);
    border:2.5px solid var(--card); box-shadow:0 0 0 1px var(--jade); cursor:grab; }
  .ctl input[type=range]::-moz-range-thumb{ width:13px; height:13px;
    border-radius:50%; background:var(--jade); border:2.5px solid var(--card); cursor:grab; }
  .ctl .val{ font-family:var(--mono); font-size:10.5px; color:var(--jade-d);
    min-width:56px; text-align:right; }

  .sw{ display:flex; align-items:center; gap:8px; cursor:pointer;
    font-size:11.5px; color:var(--ink-2); user-select:none; }
  .sw input{ position:absolute; opacity:0; width:0; height:0; }
  .sw i{ width:34px; height:18px; border-radius:9px; background:var(--line-2);
    position:relative; transition:background .15s; flex:0 0 34px; }
  .sw i::after{ content:''; position:absolute; top:2px; left:2px;
    width:14px; height:14px; border-radius:50%; background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.18); transition:transform .15s; }
  .sw input:checked + i{ background:var(--jade); }
  .sw input:checked + i::after{ transform:translateX(16px); }

  @media (max-width:820px){
    body{ padding:13px 13px 18px; }
    .grid{ grid-template-columns:1fr; }
    .ctrls{ gap:11px; }
    .ctl{ width:100%; justify-content:space-between; }
    .ctl input[type=range]{ flex:1; width:auto; }
    .rep{ max-height:290px; }
  }
</style>
</head>
<body>

<div class="kick">INTERACTIVE · 槽位填充 vs 自由生成</div>
<h1>读起来更顺的那一份，是更差的那一份</h1>
<p class="desc">
  同一井段的报告草稿。拖「生成自由度」：每越过一道阈值，就有一句从槽位填充切到自由生成。
  注意<b>三个方向相反的走势</b>——可追溯率掉得最快，数字准确率掉得最狠，而
  <b>读起来反而更顺</b>。关掉「来源标注」，两份报告就再也分不出来了。
</p>

<div class="grid">
  <div>
    <div class="stage">
      <div class="repHead">
        <div class="t">X-12 井 · 录井综合记录<span>3280.0—3296.5 m</span></div>
        <div class="mode slot" id="mode">全槽位填充</div>
      </div>
      <div class="rep" id="rep"></div>
      <div class="cap">
        <b>红色标记是核对后发现的偏差</b>，报告本身不带这个标记——它由第 4 步的数值校验产出。
        点击任一句可在下方查看它的来源与原始值。
      </div>
    </div>

    <div class="check" id="check"></div>
  </div>

  <div class="side">
    <div class="metrics" id="metrics"></div>
    <div class="verdict" id="verdict"></div>
    <div class="card">
      <h5>来源引用</h5>
      <table class="src" id="src"></table>
    </div>
  </div>
</div>

<div class="ctrls">
  <div class="ctl">
    <label>生成自由度</label>
    <input type="range" id="s-free" min="0" max="100" step="1" value="0">
    <span class="val" id="v-free">0</span>
  </div>
  <label class="sw">
    <input type="checkbox" id="s-src" checked>
    <i></i><span>来源标注</span>
  </label>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     一、报告结构与两套版本
     ---------------------------------------------------------
     at = 自由度达到多少时，这一句切到「自由生成」
     got = 这一句实际给出的正确数值个数（need 是应填个数）
     ========================================================= */
  var SLOTS = [
    {
      at: 999, need: 3,
      slot: { t: 'X-12 井，井段 3280.0—3296.5 m，钻头直径 215.9 mm。',
              src: '井史 · 基础数据', got: 3 },
      free: { t: 'X-12 井，井段 3280.0—3296.5 m，钻头直径 215.9 mm。',
              src: '井史 · 基础数据', got: 3 },
      facts: [['井号', 'X-12'], ['井段', '3280.0—3296.5 m'], ['钻头直径', '215.9 mm']]
    },
    {
      at: 32, need: 3,
      slot: { t: '钻时由 1.02 min/m 降至 0.62 min/m，降幅 39%，进入储层后明显加快。',
              src: '钻时曲线', got: 3 },
      free: { t: '钻时由约 1.0 min/m 降至 <em>0.5</em> min/m 左右，<em>降幅接近一半</em>。',
              src: '钻时曲线', got: 1 },
      facts: [['钻时（上）', '1.02 min/m'], ['钻时（下）', '0.62 min/m'], ['降幅', '39%']]
    },
    {
      at: 58, need: 3,
      slot: { t: '岩屑以灰色细砂岩为主（70%），泥岩 25%，分选中等，次棱角状。',
              src: '岩屑描述', got: 3 },
      free: { t: '岩屑以细砂岩为主，<em>分选较好</em>，磨圆度中等。',
              src: '岩屑描述', got: 0 },
      facts: [['细砂岩', '70%'], ['泥岩', '25%'], ['分选', '中等（非较好）']]
    },
    {
      at: 72, need: 4,
      slot: { t: '气测全烃由 1.8% 升至 8.4%，峰值 11.2%，C1 相对含量 82%。',
              src: '气测', got: 4 },
      free: { t: '气测全烃<em>显著升高至近 10%</em>，<em>组分齐全</em>。',
              src: null, got: 1 },
      facts: [['全烃（背景）', '1.8%'], ['全烃（储层段）', '8.4%'],
              ['峰值', '11.2%'], ['C1 占比', '82%']]
    },
    {
      at: 45, need: 2,
      slot: { t: '荧光 3 级，金黄—棕黄色，湿照、干照均有显示，判为中质油。',
              src: '荧光判读', got: 2 },
      free: { t: '荧光<em>显示良好</em>，判断为含油显示。',
              src: '荧光判读', got: 0 },
      facts: [['级别', '3 级'], ['油质', '中质油']]
    },
    {
      at: 85, need: 2,
      slot: { t: '钻井液密度 1.42 g/cm³，漏斗黏度 48 s，井段内无漏失、无气侵显示。',
              src: '钻井液', got: 2 },
      free: { t: '钻井液性能稳定，<em>未出现复杂情况</em>。',
              src: null, got: 0 },
      facts: [['密度', '1.42 g/cm³'], ['漏斗黏度', '48 s']]
    },
    {
      at: 20, need: 0, over: true,
      slot: { t: '综合钻时、岩屑、气测与荧光四项证据，本段解释为含油细砂岩储层，含油性中等。',
              src: '多源交叉', got: 0 },
      free: { t: '综合判断本段为<em>优质油气层</em>，具有良好的勘探前景。',
              src: null, got: 0 },
      facts: [['证据', '4 项'], ['结论', '含油细砂岩 · 含油性中等']]
    },
    {
      at: 95, need: 2,
      slot: { t: '建议对 3288.0—3294.0 m 进行试油，验证产能与流体性质。',
              src: '解释规范', got: 2 },
      free: { t: '建议<em>尽快</em>对该层段进行试油，<em>以落实产能</em>。',
              src: null, got: 0 },
      facts: [['建议井段', '3288.0—3294.0 m'], ['目的', '验证产能与流体性质']]
    }
  ];

  var SOURCES = [
    '井史 · 基础数据', '钻时曲线', '岩屑描述', '气测',
    '荧光判读', '钻井液', '多源交叉', '解释规范'
  ];

  function pick(i, freedom) {
    var s = SLOTS[i];
    return freedom >= s.at ? s.free : s.slot;
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  /* =========================================================
     二、汇总
     ========================================================= */
  function summarize(freedom) {
    var traced = 0, need = 0, got = 0, comp = 0, over = 0, i;
    var count = {};

    for (i = 0; i < SOURCES.length; i++) count[SOURCES[i]] = 0;

    for (i = 0; i < SLOTS.length; i++) {
      var s = SLOTS[i];
      var v = pick(i, freedom);

      if (v.src) { traced++; count[v.src]++; }
      need += s.need;
      got += v.got;
      if (v.src && v.got === s.need) comp++;
      if (s.over && freedom >= s.at) over++;
    }

    var untraced = SLOTS.length - traced;
    var wrong = need - got;
    var review = 0.8 + untraced * 0.9 + wrong * 0.6;
    var cited = 0;
    for (i = 0; i < SOURCES.length; i++) if (count[SOURCES[i]] > 0) cited++;

    return {
      traced: traced, total: SLOTS.length, untraced: untraced,
      need: need, got: got, wrong: wrong, comp: comp, over: over,
      review: review, cited: cited, count: count
    };
  }

  /* =========================================================
     三、渲染
     ========================================================= */
  var sel = -1;

  function render(freedom, showSrc) {
    var r = summarize(freedom);
    var rows = '', i;

    for (i = 0; i < SLOTS.length; i++) {
      var v = pick(i, freedom);
      var free = freedom >= SLOTS[i].at;

      rows += '<div class="line' + (sel === i ? ' sel' : '') +
        (free ? ' freeTx' : '') + '" data-i="' + i + '">' +
        '<span class="no">' + pad2(i + 1) + '</span>' +
        '<span class="body"><span class="tx">' + v.t + '</span>' +
        (showSrc ? '<br><span class="chip ' + (v.src ? 'ok' : 'none') + '">' +
          (v.src || '无来源') + '</span>' : '') +
        '</span></div>';
    }

    document.getElementById('rep').innerHTML = rows;

    /* 模式标签 */
    var modeEl = document.getElementById('mode');
    if (freedom === 0) {
      modeEl.className = 'mode slot';
      modeEl.textContent = '全槽位填充';
    } else if (r.untraced === 0) {
      modeEl.className = 'mode slot';
      modeEl.textContent = '槽位为主 · 数值有偏差';
    } else if (r.traced <= 4) {
      modeEl.className = 'mode free';
      modeEl.textContent = '自由生成为主';
    } else {
      modeEl.className = 'mode mix';
      modeEl.textContent = '混合';
    }

    /* 指标 */
    var trPct = Math.round(r.traced / r.total * 100);
    var numPct = Math.round(r.got / r.need * 100);
    var trCls = trPct === 100 ? 'good' : trPct >= 75 ? 'warn' : 'bad';
    var numCls = numPct === 100 ? 'good' : numPct >= 60 ? 'warn' : 'bad';
    var rvCls = r.review < 2.5 ? 'good' : r.review < 7 ? 'warn' : 'bad';

    document.getElementById('metrics').innerHTML =
      '<div class="metric ' + trCls + '"><div class="l">可追溯率</div>' +
        '<div class="v">' + trPct + '<small>%</small></div></div>' +
      '<div class="metric ' + numCls + '"><div class="l">数字准确率</div>' +
        '<div class="v">' + numPct + '<small>%</small></div></div>' +
      '<div class="metric ' + (r.comp === 8 ? 'good' : 'bad') +
        '"><div class="l">完整槽位</div><div class="v">' + r.comp +
        '<small>/8</small></div></div>' +
      '<div class="metric ' + rvCls + '"><div class="l">复核时间</div>' +
        '<div class="v">' + r.review.toFixed(1) + '<small>min</small></div></div>';

    /* 判词 */
    var vEl = document.getElementById('verdict'), html, vc;

    if (freedom === 0) {
      vc = 'ok';
      html = '全部 8 句带来源，<b>' + r.need + ' 个数值全对</b>，复核只要 ' +
        r.review.toFixed(1) + ' 分钟。<b>这就是槽位填充的极限状态</b>——' +
        '读起来确实比人写的干巴，但每个数都能两秒钟查到。';
    } else if (trPct === 100 && numPct < 100) {
      vc = 'warn';
      html = '来源都还在，但已有 <b>' + r.wrong + ' 个数值失真</b>。' +
        '这一档最危险：<b>标签看着没问题，数值已经变了</b>。';
    } else if (trPct >= 62) {
      vc = 'warn';
      html = '已有 <b>' + r.untraced + ' 句失去来源</b>、' + r.wrong +
        ' 个数值失真' + (r.over ? '，并且<b>结论被拔高</b>（「含油性中等」→「优质油气层」）' : '') +
        '。<b>注意这几句读起来更顺</b>——因为它把能错的地方都改成了形容词。';
    } else {
      vc = 'bad';
      html = '只剩 <b>' + r.traced + ' 句</b>能追溯，' + r.need + ' 个应有数值只对了 ' +
        r.got + ' 个。复核要 ' + r.review.toFixed(1) + ' 分钟，' +
        '<b>比人从头写还慢</b>——因为现在既要读，又要猜哪句能信。';
    }

    vEl.className = 'verdict ' + vc;
    vEl.innerHTML = html;

    /* 来源表 */
    var tr = '', k;
    for (k = 0; k < SOURCES.length; k++) {
      var c = r.count[SOURCES[k]];
      tr += '<tr class="' + (c ? '' : 'zero') + '"><td>' + SOURCES[k] + '</td>' +
        '<td class="' + (c ? 'hit' : 'miss') + '">' + (c ? c + ' 处' : '—') + '</td></tr>';
    }
    tr += '<tr><td style="padding-top:6px;color:#242b2e">引用来源</td>' +
      '<td style="padding-top:6px;color:#242b2e">' + r.cited + ' / 8</td></tr>';
    document.getElementById('src').innerHTML = tr;

    /* 核对卡 */
    var idx = sel >= 0 ? sel : 0;
    var ss = SLOTS[idx], vv = pick(idx, freedom);
    var isFree = freedom >= ss.at;

    var det = '<h6>核对 · 第 ' + pad2(idx + 1) + ' 句</h6>' +
      '<div class="row"><span class="k">生成方式</span><span class="v">' +
        (isFree ? '<em>自由生成</em>' : '槽位填充') + '</span></div>' +
      '<div class="row"><span class="k">来源</span><span class="v">' +
        (vv.src ? vv.src : '<em>无来源</em>') + '</span></div>' +
      '<div class="row"><span class="k">数值</span><span class="v">应填 ' +
        ss.need + ' 个 · 正确 ' + vv.got + ' 个' +
        (vv.got < ss.need ? '<em>（缺 ' + (ss.need - vv.got) + ' 个）</em>' : '') +
        '</span></div>';

    if (ss.over && isFree) {
      det += '<div class="row"><span class="k">结论</span><span class="v">' +
        '<em>强度被拔高：含油性中等 → 优质油气层</em></span></div>';
    }

    var tb = '<table>';
    for (k = 0; k < ss.facts.length; k++) {
      tb += '<tr><td>' + ss.facts[k][0] + '</td><td>' + ss.facts[k][1] + '</td></tr>';
    }
    tb += '</table>';
    det += '<div class="row" style="margin-top:5px"><span class="k">原始记录</span>' +
      '<span class="v">' + tb + '</span></div>';

    document.getElementById('check').innerHTML = det;

    /* 点击选中 */
    var lines = document.querySelectorAll('.line');
    for (k = 0; k < lines.length; k++) {
      lines[k].addEventListener('click', function () {
        sel = Number(this.getAttribute('data-i'));
        render(state.freedom, state.showSrc);
      });
    }
  }

  /* =========================================================
     四、主循环
     ========================================================= */
  var sFree = document.getElementById('s-free');
  var sSrc = document.getElementById('s-src');
  var vFree = document.getElementById('v-free');

  var state = { freedom: 0, showSrc: true };

  function paint() {
    state.freedom = Number(sFree.value);
    state.showSrc = sSrc.checked;
    vFree.textContent = state.freedom;
    render(state.freedom, state.showSrc);
  }

  sFree.addEventListener('input', paint);
  sSrc.addEventListener('change', paint);

  paint();

})();
</script>

</body>
</html>
