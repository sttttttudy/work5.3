<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>岩屑岩性自动识别 · 示范</title>
<style>
  :root{
    --jade:#2f7d6b; --jade-d:#235f51; --jade-l:#e6f1ec;
    --clay:#b26a39; --clay-l:#f8ecdf;
    --opt:#41699b; --opt-l:#e7eef9;
    --ink:#242b2e; --ink-2:#4d565b; --ink-3:#79828a; --ink-4:#9ba3a9;
    --line:#e9e4d8; --line-2:#ddd7c8; --line-3:#c9c2b0;
    --card:#ffffff; --soft:#fdfcf9; --paper:#fbfaf6;
    --ok:#3f8560; --warn:#a97a1c; --bad:#b05a51;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; padding:16px 18px 22px; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:13px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .kick{ font-family:var(--mono); font-size:9px; letter-spacing:.15em;
    text-transform:uppercase; color:var(--jade-d); }
  h1{ font-size:17px; font-weight:650; margin:7px 0 0; letter-spacing:-.01em; }
  .desc{ margin:7px 0 0; font-size:12px; color:var(--ink-3);
    line-height:1.7; max-width:80ch; }
  .desc b{ color:var(--ink-2); }

  .grid{ display:grid; grid-template-columns:minmax(0,1fr) 238px;
    gap:12px; margin-top:14px; align-items:start; }
  .stage{ background:var(--card); border:1px solid var(--line);
    border-radius:9px; padding:9px 10px 8px; min-width:0; }
  .stage svg{ display:block; width:100%; height:auto; }
  .legend{ display:flex; flex-wrap:wrap; gap:11px; margin-top:8px;
    font-size:9.8px; color:var(--ink-4); }
  .legend span{ display:flex; align-items:center; gap:5px; }
  .legend i{ width:9px; height:9px; border-radius:50%; display:block; }
  .legend i.ring{ background:none; border:1px solid currentColor; width:11px; height:11px; }
  .cap{ font-size:10px; color:var(--ink-4); margin-top:6px; line-height:1.6; }

  .side{ display:flex; flex-direction:column; gap:8px; min-width:0; }
  .metrics{ display:grid; grid-template-columns:1fr 1fr; gap:1px;
    background:var(--line); border:1px solid var(--line);
    border-radius:8px; overflow:hidden; }
  .metric{ background:var(--card); padding:8px 9px; }
  .metric .l{ font-family:var(--mono); font-size:7.4px; letter-spacing:.07em;
    color:var(--ink-4); white-space:nowrap; }
  .metric .v{ font-family:var(--mono); font-size:15px; margin-top:4px;
    line-height:1; color:var(--ink); }
  .metric .v small{ font-size:8px; color:var(--ink-4); margin-left:2px; }
  .metric.good .v{ color:var(--ok); }
  .metric.warn .v{ color:var(--warn); }
  .metric.bad .v{ color:var(--bad); }

  .verdict{ font-size:11.2px; line-height:1.7; color:var(--ink-2);
    border-left:2.5px solid var(--line-2); padding-left:9px; }
  .verdict b{ color:var(--ink); }
  .verdict.ok{ border-color:var(--ok); }
  .verdict.warn{ border-color:var(--warn); }
  .verdict.bad{ border-color:var(--bad); }

  .card{ border:1px solid var(--line); border-radius:8px;
    background:var(--soft); padding:9px 10px; }
  .card h5{ margin:0 0 6px; font-family:var(--mono); font-size:7.6px;
    letter-spacing:.1em; color:var(--ink-4); font-weight:400; text-transform:uppercase; }
  table{ width:100%; border-collapse:collapse; font-size:9.6px; }
  th{ font-family:var(--mono); font-size:7.2px; letter-spacing:.06em;
    color:var(--ink-4); font-weight:400; text-align:right; padding:3px 0 4px;
    border-bottom:1px solid var(--line-2); }
  td{ padding:3px 0; border-bottom:1px solid var(--line); color:var(--ink-3);
    text-align:right; font-family:var(--mono); white-space:nowrap; }
  th:first-child,td:first-child{ text-align:left; font-family:inherit; }
  tr:last-child td{ border-bottom:0; }
  td.ok{ color:var(--ok); } td.warn{ color:var(--warn); } td.bad{ color:var(--bad); }

  .recRow{ display:flex; align-items:center; gap:6px; margin:4px 0; }
  .recRow span.k{ font-size:9.6px; color:var(--ink-2); width:64px; flex:0 0 64px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .recRow span.bar{ flex:1; height:7px; background:var(--line); border-radius:2px;
    overflow:hidden; }
  .recRow span.bar i{ display:block; height:100%; border-radius:2px; }
  .recRow span.v{ font-family:var(--mono); font-size:9.2px; width:30px;
    text-align:right; color:var(--ink-2); }

  .ctrls{ display:flex; flex-wrap:wrap; align-items:center; gap:16px;
    margin-top:11px; padding:11px 14px; background:var(--card);
    border:1px solid var(--line); border-radius:9px; }
  .ctl{ display:flex; align-items:center; gap:9px; font-size:11.5px; color:var(--ink-2); }
  .ctl label{ font-family:var(--mono); font-size:9px; letter-spacing:.06em;
    color:var(--ink-3); white-space:nowrap; }
  .ctl input[type=range]{ -webkit-appearance:none; appearance:none;
    width:126px; height:4px; border-radius:2px; background:var(--line-2);
    outline:none; cursor:pointer; }
  .ctl input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none;
    width:15px; height:15px; border-radius:50%; background:var(--jade);
    border:2.5px solid var(--card); box-shadow:0 0 0 1px var(--jade); cursor:grab; }
  .ctl input[type=range]::-moz-range-thumb{ width:13px; height:13px;
    border-radius:50%; background:var(--jade); border:2.5px solid var(--card); cursor:grab; }
  .ctl .val{ font-family:var(--mono); font-size:10.5px; color:var(--jade-d);
    min-width:42px; text-align:right; }

  @media (max-width:780px){
    body{ padding:13px 13px 18px; }
    .grid{ grid-template-columns:1fr; }
    .ctrls{ gap:11px; }
    .ctl{ width:100%; justify-content:space-between; }
    .ctl input[type=range]{ flex:1; width:auto; }
  }
</style>
</head>
<body>

<div class="kick">INTERACTIVE · 特征空间</div>
<h1>为什么砂岩和粉砂岩总是分不开</h1>
<p class="desc">
  每个点是一颗岩屑在特征空间里的位置（横轴粒度、纵轴亮度）。
  拖「光照波动」——点云散开，相邻两类开始重叠，各类召回一起往下掉；
  这时<b>把网络加大没用</b>，该去改成像条件，或者补困难样本。
</p>

<div class="grid">
  <div class="stage">
    <svg id="chart" viewBox="0 0 340 300" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-label="四类岩屑在特征空间中的分布"></svg>
    <div class="legend">
      <span><i style="background:#6b89a3"></i>泥岩</span>
      <span><i style="background:#a3855f"></i>粉砂岩</span>
      <span><i style="background:#c99a56"></i>细砂岩</span>
      <span><i style="background:#8f9aa3"></i>灰岩</span>
      <span><i class="ring" style="color:#b05a51"></i>最易混的一对</span>
    </div>
    <div class="cap">圆圈是 ±1σ 范围，点云按同一组随机样本绘制，所以拖动滑杆时颗粒不会乱窜，只会扩散或收拢。</div>
  </div>

  <div class="side">
    <div class="metrics" id="metrics"></div>
    <div class="verdict" id="verdict"></div>
    <div class="card">
      <h5>各类召回</h5>
      <div id="recs"></div>
    </div>
    <div class="card">
      <h5>混淆对</h5>
      <table id="tbl"></table>
    </div>
  </div>
</div>

<div class="ctrls">
  <div class="ctl">
    <label>光照波动</label>
    <input type="range" id="s-illum" min="0" max="100" step="5" value="25">
    <span class="val" id="v-illum">25%</span>
  </div>
  <div class="ctl">
    <label>粉砂岩占比</label>
    <input type="range" id="s-silt" min="10" max="70" step="5" value="30">
    <span class="val" id="v-silt">30%</span>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     一、模型
     ---------------------------------------------------------
     四类在特征空间（粒度, 亮度）的位置
     σ = 0.035 + 光照波动 × 0.155   —— 成像条件决定点云半径
     类间重叠 ov = exp(-d² / (7.5σ²))
     单类召回 = 0.97 × Π(1 - 0.92·ov)
     ========================================================= */
  var CLS = [
    { n: '泥岩',   fx: 0.18, fy: 0.30, c: '#6b89a3' },
    { n: '粉砂岩', fx: 0.45, fy: 0.52, c: '#a3855f' },
    { n: '细砂岩', fx: 0.72, fy: 0.62, c: '#c99a56' },
    { n: '灰岩',   fx: 0.55, fy: 0.85, c: '#8f9aa3' }
  ];

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  /* 稳定的伪随机 + 固定的标准正态样本 */
  function seedFn(a) {
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function gauss(rnd) {
    var u = 0, v = 0;
    while (u === 0) u = rnd();
    while (v === 0) v = rnd();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  /* 每类 26 个固定标准正态样本（只算一次） */
  var Z = CLS.map(function (cl, ci) {
    var rnd = seedFn(101 + ci * 37), arr = [], k;
    for (k = 0; k < 26; k++) arr.push([gauss(rnd), gauss(rnd)]);
    return arr;
  });

  function compute(st) {
    var sd = 0.035 + st.illum / 100 * 0.155;

    /* 先验权重：粉砂岩占比变化会改变类别分布 */
    var w = [1 - st.silt / 100 - 0.20, st.silt / 100, 0.12, 0.08];
    var i, j;
    for (i = 0; i < 4; i++) if (w[i] < 0.02) w[i] = 0.02;
    var sumW = w.reduce(function (a, b) { return a + b; }, 0);

    /* 两两重叠 */
    var ov = [], rec = [], pairs = [];
    for (i = 0; i < 4; i++) {
      ov.push([0, 0, 0, 0]);
      rec.push(0.97);
    }
    var denom = 7.5 * sd * sd + 1e-6;

    for (i = 0; i < 4; i++) {
      for (j = i + 1; j < 4; j++) {
        var dx = CLS[i].fx - CLS[j].fx;
        var dy = CLS[i].fy - CLS[j].fy;
        var d2 = dx * dx + dy * dy;
        var val = Math.exp(-d2 / denom);
        ov[i][j] = val; ov[j][i] = val;
        pairs.push({ i: i, j: j, v: val, d: Math.sqrt(d2) });
        rec[i] *= (1 - val * 0.92);
        rec[j] *= (1 - val * 0.92);
      }
    }

    for (i = 0; i < 4; i++) {
      rec[i] = clamp(0.97 * (1 + 0) * (rec[i] / 0.97) * 1, 0.18, 0.99);
      rec[i] = clamp(rec[i], 0.18, 0.99);
    }

    /* 综合准确率（按权重） */
    var accSum = 0;
    for (i = 0; i < 4; i++) accSum += w[i] * rec[i];
    var acc = accSum / sumW;

    pairs.sort(function (a, b) { return b.v - a.v; });

    var worst = 0;
    for (i = 1; i < 4; i++) if (rec[i] < rec[worst]) worst = i;

    return {
      sd: sd, w: w, rec: rec, ov: ov, pairs: pairs,
      acc: acc, worst: worst,
      compErr: (1 - acc) * 46
    };
  }

  /* =========================================================
     二、绘图
     ========================================================= */
  var SW = 340, SH = 300;
  var X0 = 34, Y0 = 16, X1 = SW - 14, Y1 = SH - 30;

  function PX(v) { return X0 + v * (X1 - X0); }
  function PY(v) { return Y1 - v * (Y1 - Y0); }

  function drawChart(st, res) {
    var s = '', i, k;

    s += '<rect width="' + SW + '" height="' + SH + '" fill="#ffffff"/>';
    s += '<rect x="' + X0 + '" y="' + Y0 + '" width="' + (X1 - X0) +
      '" height="' + (Y1 - Y0) + '" fill="#fdfcf9" stroke="#e9e4d8"/>';

    /* 网格 */
    [0.25, 0.5, 0.75].forEach(function (g) {
      s += '<line x1="' + PX(g).toFixed(1) + '" y1="' + Y0 + '" x2="' + PX(g).toFixed(1) +
        '" y2="' + Y1 + '" stroke="#f4f1e9"/>';
      s += '<line x1="' + X0 + '" y1="' + PY(g).toFixed(1) + '" x2="' + X1 +
        '" y2="' + PY(g).toFixed(1) + '" stroke="#f4f1e9"/>';
    });

    /* 轴标题 */
    s += '<text x="' + ((X0 + X1) / 2) + '" y="' + (SH - 10) + '" font-size="8" ' +
      'fill="#9ba3a9" text-anchor="middle">粒度特征 →</text>';
    s += '<text x="4" y="' + (Y0 + 42) + '" font-size="8" fill="#9ba3a9">亮</text>';
    s += '<text x="4" y="' + (Y0 + 56) + '" font-size="8" fill="#9ba3a9">度</text>';

    /* 最易混的一对：连虚线 */
    var top = res.pairs[0];
    if (top && top.v > 0.02) {
      var a = CLS[top.i], b = CLS[top.j];
      s += '<line x1="' + PX(a.fx).toFixed(1) + '" y1="' + PY(a.fy).toFixed(1) +
        '" x2="' + PX(b.fx).toFixed(1) + '" y2="' + PY(b.fy).toFixed(1) +
        '" stroke="#b05a51" stroke-width="1.2" stroke-dasharray="4 3" ' +
        'stroke-opacity="' + (0.25 + top.v * 0.6).toFixed(2) + '"/>';

      var mx = (PX(a.fx) + PX(b.fx)) / 2;
      var my = (PY(a.fy) + PY(b.fy)) / 2;
      s += '<text x="' + mx.toFixed(1) + '" y="' + (my - 5).toFixed(1) +
        '" font-size="7.4" fill="#b05a51" text-anchor="middle" font-weight="600">' +
        '重叠 ' + Math.round(top.v * 100) + '%</text>';
    }

    /* 各类：±1σ 圈 + 点云 + 中心 */
    for (i = 0; i < 4; i++) {
      var cl = CLS[i];
      var rad = Math.max(6, res.sd * (X1 - X0) * 1.6);

      s += '<circle cx="' + PX(cl.fx).toFixed(1) + '" cy="' + PY(cl.fy).toFixed(1) +
        '" r="' + rad.toFixed(1) + '" fill="none" stroke="' + cl.c +
        '" stroke-width="1" stroke-opacity=".5"/>';

      for (k = 0; k < Z[i].length; k++) {
        var px = clamp(cl.fx + Z[i][k][0] * res.sd * 0.62, 0.02, 0.98);
        var py = clamp(cl.fy + Z[i][k][1] * res.sd * 0.62, 0.02, 0.98);
        s += '<circle cx="' + PX(px).toFixed(1) + '" cy="' + PY(py).toFixed(1) +
          '" r="1.9" fill="' + cl.c + '" fill-opacity=".62"/>';
      }

      s += '<circle cx="' + PX(cl.fx).toFixed(1) + '" cy="' + PY(cl.fy).toFixed(1) +
        '" r="3.4" fill="' + cl.c + '" stroke="#ffffff" stroke-width="1.2"/>';
      s += '<text x="' + (PX(cl.fx) + 6).toFixed(1) + '" y="' +
        (PY(cl.fy) - 6).toFixed(1) + '" font-size="8.4" fill="#79828a" ' +
        'font-weight="600">' + cl.n + '</text>';
    }

    /* 右下角 σ 说明 */
    s += '<text x="' + (X1 - 4) + '" y="' + (Y0 + 12) + '" font-size="7.6" ' +
      'fill="#9ba3a9" text-anchor="end" font-family="ui-monospace,monospace">' +
      'σ = ' + res.sd.toFixed(3) + '</text>';

    document.getElementById('chart').innerHTML = s;
  }

  /* =========================================================
     三、侧栏
     ========================================================= */
  function drawSide(res) {
    var accCls = res.acc > 0.86 ? 'good' : res.acc > 0.70 ? 'warn' : 'bad';
    var ceCls = res.compErr < 8 ? 'good' : res.compErr < 14 ? 'warn' : 'bad';
    var wCls = res.rec[res.worst] > 0.80 ? 'good' : res.rec[res.worst] > 0.60 ? 'warn' : 'bad';

    document.getElementById('metrics').innerHTML =
      '<div class="metric ' + accCls + '"><div class="l">综合准确率</div>' +
        '<div class="v">' + (res.acc * 100).toFixed(0) + '<small>%</small></div></div>' +
      '<div class="metric ' + ceCls + '"><div class="l">组分误差</div>' +
        '<div class="v">' + res.compErr.toFixed(0) + '<small>%</small></div></div>' +
      '<div class="metric"><div class="l">点云半径 σ</div>' +
        '<div class="v">' + res.sd.toFixed(3) + '<small></small></div></div>' +
      '<div class="metric ' + wCls + '"><div class="l">最差类召回</div>' +
        '<div class="v">' + (res.rec[res.worst] * 100).toFixed(0) + '<small>%</small></div></div>';

    /* 判词 */
    var vEl = document.getElementById('verdict'), html, vc;
    var topPair = res.pairs[0];
    var pn = topPair ? CLS[topPair.i].n + ' ↔ ' + CLS[topPair.j].n : '—';

    if (res.acc > 0.86) {
      vc = 'ok';
      html = '点云分离得开，模型够用。但注意<b>最差类召回只有 ' +
        (res.rec[res.worst] * 100).toFixed(0) + '%</b>——整体准确率会把它平均掉。' +
        '主指标应该看这一类。';
    } else if (res.acc > 0.70) {
      vc = 'warn';
      html = '<b>' + pn + '</b> 已经开始重叠（' + Math.round(topPair.v * 100) +
        '%）。<b>这时换更大的网络没用</b>——该去做成像标准化，或者补这一对的困难样本。';
    } else {
      vc = 'bad';
      html = '点云糊成一片，四类互相重叠。<b>继续调模型是浪费预算</b>：' +
        '回到捞样与拍摄环节，把光照、距离、倍率固定下来，比换十个骨干网络都有效。';
    }
    vEl.className = 'verdict ' + vc;
    vEl.innerHTML = html;

    /* 各类召回条 */
    var recs = '', i;
    for (i = 0; i < 4; i++) {
      var r = res.rec[i];
      var pct = Math.round(r * 100);
      var c = r > 0.80 ? '#2f7d6b' : r > 0.60 ? '#a97a1c' : '#b05a51';
      recs += '<div class="recRow">' +
        '<span class="k">' + CLS[i].n + '</span>' +
        '<span class="bar"><i style="width:' + pct + '%;background:' + c +
        ';opacity:.85"></i></span>' +
        '<span class="v" style="color:' + c + '">' + pct + '</span></div>';
    }
    document.getElementById('recs').innerHTML = recs;

    /* 混淆对表 */
    var rows = '', k;
    var shown = res.pairs.slice(0, 3);
    for (k = 0; k < shown.length; k++) {
      var pr = shown[k];
      var p = Math.round(pr.v * 100);
      var cl = p >= 40 ? 'bad' : p >= 15 ? 'warn' : 'ok';
      rows += '<tr><td>' + CLS[pr.i].n + ' ↔ ' + CLS[pr.j].n + '</td>' +
        '<td class="' + cl + '">' + p + '%</td></tr>';
    }
    document.getElementById('tbl').innerHTML =
      '<thead><tr><th>类对</th><th>重叠</th></tr></thead><tbody>' + rows + '</tbody>';
  }

  /* =========================================================
     四、主循环
     ========================================================= */
  var sIllum = document.getElementById('s-illum');
  var sSilt = document.getElementById('s-silt');
  var vIllum = document.getElementById('v-illum');
  var vSilt = document.getElementById('v-silt');

  var state = { illum: 25, silt: 30 };

  function paint() {
    state.illum = Number(sIllum.value);
    state.silt = Number(sSilt.value);

    vIllum.textContent = state.illum + '%';
    vSilt.textContent = state.silt + '%';

    var res = compute(state);
    drawChart(state, res);
    drawSide(res);
  }

  sIllum.addEventListener('input', paint);
  sSilt.addEventListener('input', paint);

  paint();

})();
</script>

</body>
</html>
